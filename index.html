/* built lazily — the index depends on entry mappers defined
   further down in this script */
let searchIndexCache = null;
let searchIndexLang = null;
function getSearchIndex() {
  if (searchIndexCache && searchIndexLang === CURRENT_LANG) return searchIndexCache;
  searchIndexLang = CURRENT_LANG;
  const loc = (arr) => (CURRENT_LANG === "hi" ? locAll(arr) : arr);
  searchIndexCache = [
  ...loc(timelineEvents).map((e) => ({ group: "Heritage Timeline", title: e.title, sub: t(e.date) + " · " + t(e.person), route: "/", detail: e.id, kind: "timeline", text: (e.title + " " + e.summary + " " + e.body + " " + e.person + " " + e.tags + " " + e.era).toLowerCase() })),
  ...loc(tirthankars).map((e) => ({ group: "Tirthankars", title: e.title, sub: t(e.facts[0].v) + " · " + t(e.facts[1].v), route: "/tirthankars", detail: e.id, kind: "timeline", text: (e.title + " " + e.summary + " " + e.body + " " + e.person + " " + e.tags).toLowerCase() })),
  ...loc(agamaEntries).map((e) => ({ group: "Agamas", title: e.title, sub: t(e.category) + " · " + t(e.date), route: "/agamas", detail: e.id, kind: "timeline", text: (e.title + " " + e.summary + " " + e.body + " " + e.person + " " + e.tags).toLowerCase() })),
  ...loc(rulerEntries).map((e) => ({ group: "Rulers & Patrons", title: e.title, sub: t(e.era) + " · " + t(e.date), route: "/jain-rulers", detail: e.id, kind: "timeline", text: (e.title + " " + e.summary + " " + e.body + " " + e.person + " " + e.tags).toLowerCase() })),
  ...loc(fighterEntries).map((e) => ({ group: "Freedom Fighters", title: e.title, sub: t(e.era) + " · " + t(e.date), route: "/freedom-fighters", detail: e.id, kind: "timeline", text: (e.title + " " + e.summary + " " + e.body + " " + e.person + " " + e.tags).toLowerCase() })),
  ...loc(acharyaEntries).map((e) => ({ group: "Acharyas", title: e.title, sub: t(e.era) + " · " + t(e.person), route: "/acharyas", detail: e.id, kind: "timeline", text: (e.title + " " + e.summary + " " + e.body + " " + e.person + " " + e.tags).toLowerCase() })),
  ...loc(jinlayas).map((j) => ({ group: "Jinlayas", title: j.name, sub: t(j.state) + " · " + j.city, route: "/jinlayas", detail: j.id, kind: "temple", text: (j.name + " " + j.state + " " + j.city + " " + j.tradition + " " + j.period + " " + j.summary + " " + j.body).toLowerCase() })),
  ...loc(blogArticles).map((e) => ({ group: "Blog", title: e.title, sub: t(e.category) + " · " + t(e.readTime), route: "/blog/" + e.slug, kind: "article", text: (e.title + " " + e.excerpt + " " + e.category + " " + e.sections.map((s) => s.h + " " + s.p.join(" ")).join(" ")).toLowerCase() }))
  ];
  searchIndexCache.forEach((r) => { r.text = r.text.replace(/\u2011/g, "-"); });
  return searchIndexCache;
}

function Highlight({ text, query }) {
  if (!query) return <>{text}</>;
  const i = String(text).toLowerCase().replace(/\u2011/g, "-").indexOf(query.toLowerCase().replace(/\u2011/g, "-"));
  if (i === -1) return <>{text}</>;
  return <>{text.slice(0, i)}<mark>{text.slice(i, i + query.length)}</mark>{text.slice(i + query.length)}</>;
}

function SearchModal({ open, onClose }) {
  const lang = useLang();
  const [q, setQ] = useState("");
  const inputRef = useRef(null);
  const wrapRef = useRef(null);
  const returnRef = useRef(null);

  useEffect(() => {
    if (!open) { setQ(""); return undefined; }
    returnRef.current = document.activeElement;
    lockPageScroll();
    const t = setTimeout(() => { if (inputRef.current) inputRef.current.focus({ preventScroll: true }); }, 60);
    const onKey = (e) => {
      if (e.key === "Escape") { e.stopPropagation(); onClose(); }
      if (e.key === "Enter") {
        const first = wrapRef.current && wrapRef.current.querySelector(".result-item");
        if (first && document.activeElement === inputRef.current) { e.preventDefault(); first.click(); }
      }
      if (e.key === "Tab" && wrapRef.current) {
        const f = wrapRef.current.querySelectorAll('a[href],button:not([disabled]),input');
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener("keydown", onKey, true);
    return () => {
      clearTimeout(t);
      unlockPageScroll();
      document.removeEventListener("keydown", onKey, true);
      if (returnRef.current && returnRef.current.focus) returnRef.current.focus();
    };
  }, [open, onClose]);

  const results = useMemo(() => {
    const term = q.trim().toLowerCase();
    if (term.length < 2) return [];
    const words = term.split(/\s+/);
    return getSearchIndex().filter((r) => words.every((w) => r.text.indexOf(w) !== -1)).slice(0, 40);
  }, [q, lang]);

  const grouped = useMemo(() => {
    const map = {};
    results.forEach((r) => { (map[r.group] = map[r.group] || []).push(r); });
    return map;
  }, [results]);

  const go = (r) => {
    if (r.detail && r.kind) openDetail(r.kind, r.detail);
    onClose();
    navigate(r.route);
  };

  if (!open) return null;
  const term = q.trim();
  return (
    <div className="modal-overlay" style={{ alignItems: "flex-start" }}
      onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="search-panel" role="dialog" aria-modal="true" aria-label={t("Search the archive")} ref={wrapRef} onMouseDown={(e) => e.stopPropagation()}>
        <div className="search-head">
          <div className="field">
            <Icon name="search" size={19} />
            <input ref={inputRef} type="search" value={q} onChange={(e) => setQ(e.target.value)}
              placeholder={t("Search Tirthankars, Agamas, rulers, temples, articles…")}
              aria-label={t("Search query")} aria-describedby="search-hint" />
          </div>
          <button className="icon-btn" onClick={onClose} aria-label={t("Close search")}><Icon name="x" size={19} /></button>
        </div>
        <div className="search-results">
          {term.length < 2 ? (
            <div className="empty-state" style={{ border: 0, background: "transparent", padding: "36px 16px" }}>
              <h3>{t("Begin typing to search")}</h3>
              <p style={{ margin: 0 }}>
                {t("Try “Mahavira”, “Agama”, “Palitana”, “Kharavela” or “lineage”.")}
              </p>
            </div>
          ) : results.length === 0 ? (
            <div className="empty-state" style={{ border: 0, background: "transparent", padding: "36px 16px" }}>
              <h3>{t("No results found")}</h3>
              <p style={{ margin: 0 }}>{t("Nothing matched “{term}”. Try a shorter word — or browse the sections from the menu.", { term })}</p>
            </div>
          ) : (
            Object.keys(grouped).map((g) => (
              <div className="result-group" key={g}>
                <h4>{t(g)} · {grouped[g].length}</h4>
                {grouped[g].map((r, i) => (
                  <button className="result-item" key={g + i} onClick={() => go(r)}>
                    <Icon name={r.kind === "article" ? "fileText" : r.kind === "temple" ? "mapPin" : "clock"} size={16} />
                    <span>
                      <strong><Highlight text={r.title} query={term} /></strong>
                      <span>{r.sub}</span>
                    </span>
                  </button>
                ))}
              </div>
            ))
          )}
        </div>
        <div className="search-hint" id="search-hint">
          <span><kbd>Enter</kbd> {t("open first result")}</span>
          <span><kbd>Esc</kbd> {t("close")}</span>
          <span><kbd>Tab</kbd> {t("navigate results")}</span>
          <span style={{ marginLeft: "auto" }}>{results.length} {results.length === 1 ? t("result") : t("results")}</span>
        </div>
      </div>
    </div>
  );
}

/* Direct-download PDF link.
   The HTML `download` attribute is ignored for cross-origin URLs, so we
   instead ask Cloudinary for the file with the fl_attachment flag: its
   delivery then responds with Content-Disposition: attachment and the
   browser saves the file straight to disk instead of opening a tab. */
function pdfDownloadSlug(title) {
  const s = String(title || "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
  return s || "jain-agama";
}
function pdfDownloadUrl(url, title) {
  if (typeof url !== "string" || url.indexOf("/upload/") === -1) return url;
  if (url.indexOf("/fl_attachment") !== -1) return url;
  return url.replace("/upload/", "/upload/fl_attachment:" + pdfDownloadSlug(title) + "/");
}

/*
   TimelineSection — the shared living timeline used by the Home
   page and by every timeline-based section (Tirthankars, Agamas,
   Acharyas, Rulers, Freedom Fighters).
   props:
     events           array of unified timeline entries
     filters          chip labels; filters[0] is the 'all' value
     searchPlaceholder placeholder for the search field
     extraControls    optional extra select(s) for the control row
     footerNote       note rendered in the detail modal
*/
function TimelineSection({
  events = timelineEvents,
  lookupEvents = null,
  filters = TIMELINE_FILTERS,
  searchPlaceholder = "Search events, people, texts…",
  extraControls = null,
  footerNote = "Traditional accounts and modern historical estimates are distinguished throughout this archive; where dating is contested, a range is given."
}) {
  const allLabel = filters[0];
  /* localize for the current language (Hindi default) — these arrays
     re-map on language change, so every memo below depends on them */
  const evList = useContent(events);
  /* lookupEvents = the FULL unfiltered set, so details requested
     from global search still open even when a filter is active */
  const allEvents = useContent(lookupEvents || events);
  const lookupRef = useRef(allEvents);
  lookupRef.current = allEvents;
  const [filter, setFilter] = useState(allLabel);
  const [q, setQ] = useState("");
  const [openId, setOpenId] = useState(null);
  const [modalId, setModalId] = useState(null);
  const [activeId, setActiveId] = useState(null);
  const [fill, setFill] = useState(0);
  const wrapRef = useRef(null);
  const rafRef = useRef(0);

  const entries = useMemo(() => {
    const term = q.trim().toLowerCase();
    return evList.filter((e) => {
      const inCat = filter === allLabel || e.category === filter;
      if (!inCat) return false;
      if (!term) return true;
      return (e.title + " " + e.summary + " " + e.body + " " + (e.person || "") + " " + (e.tags || "")).toLowerCase().replace(/\u2011/g, "-").indexOf(term) !== -1;
    });
  }, [filter, q, evList]);

  /* scroll-driven line fill + active marker (rAF throttled) */
  useEffect(() => {
    const onScroll = () => {
      if (rafRef.current) return;
      rafRef.current = requestAnimationFrame(() => {
        rafRef.current = 0;
        const el = wrapRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        const vh = window.innerHeight;
        const total = rect.height || 1;
        const progressed = Math.min(Math.max(vh * 0.55 - rect.top, 0), total);
        setFill((progressed / total) * 100);
        const mid = vh * 0.45;
        let best = null, bestDist = Infinity;
        Array.prototype.forEach.call(el.querySelectorAll(".timeline-entry"), (node) => {
          const r = node.getBoundingClientRect();
          const d = Math.abs(r.top + r.height / 2 - mid);
          if (r.bottom > 0 && r.top < vh && d < bestDist) { bestDist = d; best = node.id.replace("ev-", ""); }
        });
        if (best) setActiveId(best);
      });
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
    };
  }, [entries.length]);

  /* open a detail coming from global search — only if this
     timeline actually contains the requested entry */
  useEffect(() => {
    const consume = () => {
      const p = navState.pending;
      if (p && p.type === "timeline" && lookupRef.current.some((e) => e.id === p.id)) {
        setModalId(p.id);
        navState.pending = null;
      }
    };
    consume();
    window.addEventListener("app:pending", consume);
    return () => window.removeEventListener("app:pending", consume);
  }, []);

  const modalIndex = entries.findIndex((e) => e.id === modalId);
  const modalEvent = modalIndex >= 0 ? entries[modalIndex] : (modalId ? allEvents.find((e) => e.id === modalId) : null);
  const reset = () => { setFilter(allLabel); setQ(""); };

  return (
    <div className="timeline-wrap">
      <div className="timeline-progress" aria-hidden="true"><span style={{ width: fill.toFixed(1) + "%" }} /></div>
      <div className="timeline-controls">
        <div className="chip-row" role="group" aria-label={t("Filter timeline entries")}>
          {filters.map((f) => (
            <button key={f} className="chip" aria-pressed={filter === f} onClick={() => setFilter(f)}>{t(f)}</button>
          ))}
        </div>
        <div className="field grow">
          <Icon name="search" size={16} />
          <input type="search" value={q} onChange={(e) => setQ(e.target.value)}
            placeholder={t(searchPlaceholder)} aria-label={t(searchPlaceholder)} />
        </div>
        {extraControls}
        <button className="btn secondary small" onClick={reset}>{t("Reset Filters")}</button>
      </div>

      <p className="count-note" role="status">
        {t("Showing {n} of {m} entries", { n: entries.length, m: evList.length })}
        {filter !== allLabel ? " · " + t(filter) : ""}{q ? " · \"" + q + "\"" : ""}
      </p>

      {entries.length === 0 ? (
        <div className="empty-state" style={{ marginTop: 30 }}>
          <h3>{t("Nothing matches those filters")}</h3>
          <p>{t("Try another filter, or clear the search field.")}</p>
          <button className="btn small" onClick={reset}>{t("Reset Filters")}</button>
        </div>
      ) : (
        /* the vertical line lives INSIDE the track, so it never crosses
           the filter chips, search bar or result counter above it */
        <div className="timeline-track" ref={wrapRef}>
          <div className="timeline-line" style={{ "--fill": fill + "%" }} aria-hidden="true" />
          <div className="timeline-entries">
            {entries.map((ev) => (
              <TimelineCard key={ev.id} ev={ev}
                isActive={activeId === ev.id}
                open={openId === ev.id}
                onToggle={() => setOpenId(openId === ev.id ? null : ev.id)}
                onExplore={() => setModalId(ev.id)} />
            ))}
          </div>
        </div>
      )}

      <DetailModal
        open={!!modalEvent}
        onClose={() => setModalId(null)}
        title={modalEvent ? modalEvent.title : ""}
        subtitle={modalEvent ? modalEvent.date + " · " + t(modalEvent.era) : ""}
        imageTitle={modalEvent ? modalEvent.wiki : null}
        imageSrc={modalEvent ? modalEvent.img : null}
        imageAlt={modalEvent ? modalEvent.title : ""}
        facts={modalEvent ? modalEvent.facts : []}
        refs={modalEvent ? [modalEvent.source] : []}
        body={modalEvent ? (
          <>
            <p style={{ fontSize: "1.06rem" }}>{modalEvent.summary}</p>
            <p>{modalEvent.body}</p>
            {modalEvent.person ? <p style={{ fontSize: ".9rem" }}><strong>{t("Associated person / tradition:")}</strong> {t(modalEvent.person)}</p> : null}
            {modalEvent.contributions && modalEvent.contributions.length ? (
              <>
                <div className="modal-sub">{t("Key contributions")}</div>
                <ul className="check-list">{modalEvent.contributions.map((c, i) => <li key={i}><Icon name="check" size={15} />{c}</li>)}</ul>
              </>
            ) : null}
            {modalEvent.pdf ? (
              <p style={{ marginTop: 14 }}>
                <a className="btn small" href={pdfDownloadUrl(modalEvent.pdf, modalEvent.title)}
                  download target="_blank" rel="noopener noreferrer">
                  Download PDF <Icon name="fileText" size={15} />
                </a>
              </p>
            ) : null}
            {modalEvent.verify ? (
              <p style={{ fontSize: ".86rem", marginTop: 14 }}>
                <span className={"verify " + modalEvent.verify}><Icon name={modalEvent.verify === "ok" ? "check" : "info"} size={12} /> {t(VERIFY_LABEL[modalEvent.verify])}</span>{" "}
                {modalEvent.verifyNote ? " — " + t(modalEvent.verifyNote) : ""}
              </p>
            ) : null}
          </>
        ) : null}
        footerNote={footerNote}
        prevLabel="Newer entry"
        nextLabel="Older entry"
        onPrev={modalIndex > 0 ? () => setModalId(entries[modalIndex - 1].id) : null}
        onNext={modalIndex >= 0 && modalIndex < entries.length - 1 ? () => setModalId(entries[modalIndex + 1].id) : null}
      />
    </div>
  );
}

/* ============================================================
   14. JINLAYAS — interactive map of Jain temples in India
   ============================================================ */
function JinlayasPage() {
  const jl = useContent(jinlayas);
  const [selectedState, setSelectedState] = useState(null);
  const [modalId, setModalId] = useState(null);

  const stateHasTemples = (n) => jl.some((j) => j.state === n);
  const templesIn = (n) => jl.filter((j) => j.state === n);
  const templeStates = useMemo(() => Array.from(new Set(jl.map((j) => j.state))).sort(), []);

  /* open a temple detail coming from global search or the home page */
  useEffect(() => {
    const consume = () => {
      const p = navState.pending;
      if (p && p.type === "temple") {
        const t = jl.find((j) => j.id === p.id);
        if (t) { setSelectedState(t.state); setModalId(t.id); navState.pending = null; }
      }
    };
    consume();
    window.addEventListener("app:pending", consume);
    return () => window.removeEventListener("app:pending", consume);
  }, []);

  const list = selectedState ? templesIn(selectedState) : [];
  const idx = list.findIndex((j) => j.id === modalId);
  const current = modalId ? jl.find((j) => j.id === modalId) : null;

  return (
    <div className="page-enter">
      <PageHero canvas eyebrow={t("Jain temples across India")}
        title={t("The <em>Jinlayas</em> — a living map of tirthas")}
        lead={t("Select a state on the map of India to discover the Jain temples it holds — and open any temple for its history, tradition and details.")} />
      <section className="section tight">
        <div className="container">
          <div className="accuracy-note">
            <Icon name="info" size={19} />
            <div>
              <strong>{t("About this map.")}</strong> {t("jinlayasAccuracy")}
            </div>
          </div>

          <div className="map-layout">
            <div className="map-panel">
              <div className="map-head">
                <div className="eyebrow">{t("Select a state")}</div>
                <p className="count-note">
                  {t("{n} states & union territories here hold featured temples · {m} temples in total", { n: templeStates.length, m: jl.length })}
                </p>
              </div>
              <div className="india-map-wrap">
                <svg viewBox={INDIA_MAP.vb} className="india-map" role="img"
                  aria-label={t("Map of India; states holding featured Jain temples are selectable")}>
                  {INDIA_MAP.states.map((s) => {
                    const has = stateHasTemples(s.n);
                    const on = selectedState === s.n;
                    return (
                      <path key={s.n} d={s.d}
                        className={"state" + (has ? " has-temples" : "") + (on ? " selected" : "")}
                        tabIndex={has ? 0 : -1}
                        role={has ? "button" : undefined}
                        aria-pressed={has ? on : undefined}
                        onClick={() => { if (has) setSelectedState(on ? null : s.n); }}
                        onKeyDown={(e) => {
                          if (has && (e.key === "Enter" || e.key === " ")) {
                            e.preventDefault();
                            setSelectedState(on ? null : s.n);
                          }
                        }}>
                        <title>{s.n + (has ? " — " + templesIn(s.n).length + " " + t("featured temple(s)") : " — " + t("no featured temples"))}</title>
                      </path>
                    );
                  })}
                </svg>
              </div>
              <div className="chip-row" style={{ marginTop: 18 }}>
                {templeStates.map((st) => (
                  <button key={st} className="chip" aria-pressed={selectedState === st}
                    onClick={() => setSelectedState(selectedState === st ? null : st)}>{t(st)}</button>
                ))}
              </div>
            </div>

            <div className="map-side">
              {selectedState ? (
                <div>
                  <div className="eyebrow">{t(selectedState)}</div>
                  <h3 style={{ fontSize: "1.8rem", margin: ".3em 0 .6em" }}>
                    {list.length} {list.length === 1 ? t("featured Jinlaya") : t("featured Jinlayas")}
                  </h3>
                  <div className="temple-list">
                    {list.map((j) => (
                      <button key={j.id} className="temple-item" onClick={() => setModalId(j.id)}>
                        <span className="temple-item-main">
                          <strong>{j.name}</strong>
                          <span>{j.city} · {t(j.tradition)} · {j.period}</span>
                        </span>
                        <Icon name="chevronRight" size={16} />
                      </button>
                    ))}
                  </div>
                  <button className="btn secondary small" style={{ marginTop: 18 }}
                    onClick={() => setSelectedState(null)}>{t("Clear selection")}</button>
                </div>
              ) : (
                <div className="empty-state">
                  <div className="section-icon" style={{ margin: "0 auto 14px" }}><Icon name="map" size={21} /></div>
                  <h3>{t("Pick a state on the map")}</h3>
                  <p>{t("Click a highlighted state — or use the chips below the map — to see the Jain temples featured there.")}</p>
                </div>
              )}
            </div>
          </div>
        </div>
      </section>

      <DetailModal open={!!current} onClose={() => setModalId(null)}
        title={current ? current.name : ""}
        subtitle={current ? current.city + " · " + t(current.state) : ""}
        imageTitle={current ? current.wiki : null} imageSrc={current ? current.img : null} imageAlt={current ? current.name : ""}
        body={current ? (
          <>
            <p style={{ fontSize: "1.06rem" }}>{current.summary}</p>
            <p>{current.body}</p>
          </>
        ) : null}
        facts={current ? current.facts : []}
        refs={current ? current.refs : []}
        footerNote="This map lists featured Jain temples, not an exhaustive census; attributions follow standard reference works and site records, and traditional details are labelled as tradition."
        prevLabel="Another temple in this state" nextLabel="Next temple in this state"
        onPrev={idx > 0 ? () => setModalId(list[idx - 1].id) : null}
        onNext={idx >= 0 && idx < list.length - 1 ? () => setModalId(list[idx + 1].id) : null} />
    </div>
  );
}

function LineageTree({ selectedId, onSelect, query }) {

  return (
    <div className={"lineage-shell" + (inView ? " in" : "")} ref={ref}>

          <div className={"lineage-branch " + branch.className} key={branch.key}>
            <h3>{t(branch.label)} <small>{t(branch.sub)}</small></h3>

              {branch.nodes.map((n, i) => {

                    style={{ transitionDelay: (i * 70) + "ms", opacity: matches ? undefined : 0.32 }}

                    <span className="node-branch-link">↳ {t(n.relation)}</span>

        ))}

        {t("lineageNote")}

/* ============================================================
   16b. ACHARYA CHRONOLOGY SECTION (JainKosh succession list)
   Renders the user-supplied acharyaChronology records with
   search + incremental reveal.
   ============================================================ */
function AcharyaChronology() {
  const [q, setQ] = useState("");
  const [visible, setVisible] = useState(24);
  const term = q.trim().toLowerCase();
  const items = useMemo(() => {
    if (!term) return acharyaChronology;
    return acharyaChronology.filter((e) =>
      (e.no + " " + e.time + " " + e.name + " " + e.guru + " " + e.work).toLowerCase().replace(/\u2011/g, "-").indexOf(term) !== -1);
  }, [term]);
  const shown = items.slice(0, visible);

  return (
    <div style={{ marginTop: "clamp(48px,7vw,80px)" }}>
      <SectionHeading center eyebrow={t("JainKosh chronology")}
        title={t("acharyaChronologyTitle")}
        lead={t("{n} records from {src} — serial numbers, periods, teachers and principal works, reproduced exactly as the source gives them.", { n: acharyaChronology.length, src: ACHARYA_CHRONOLOGY_SOURCE.label })} />

      <div className="accuracy-note">
        <Icon name="info" size={19} />
        <div>
          <strong>{t("chronologyVerbatim")}</strong> {t("chronologyVerbatimA")}
          <a href={ACHARYA_CHRONOLOGY_SOURCE.url} target="_blank" rel="noopener noreferrer">{ACHARYA_CHRONOLOGY_SOURCE.label}</a>
          {t("chronologyVerbatimB")}
        </div>
      </div>

      <div className="toolbar" style={{ marginTop: 30 }}>
        <div className="field grow">
          <Icon name="search" size={18} />
          <input type="search" value={q}
            onChange={(e) => { setQ(e.target.value); setVisible(24); }}
            placeholder={t("Search by name, क्रमांक, teacher or work…")}
            aria-label={t("Search the acharya chronology")} />
        </div>
        <span className="count-note">
          {t("Showing {n} of {m} records", { n: Math.min(visible, items.length), m: items.length })}{q ? " · “" + q + "”" : ""}
        </span>
      </div>

      {items.length === 0 ? (
        <div className="empty-state">{t("No chronology record matches “{q}”.", { q })}</div>
      ) : (
        <>
          <div className="grid cols-3">
            {shown.map((e, i) => (
              <Reveal key={e.no} delay={"d" + ((i % 3) + 1)}>
                <article className="card">
                  <div className="card-body">
                    <div className="card-kicker">{t("क्रमांक {n}", { n: e.no })}</div>
                    <h3>{e.name}</h3>
                    <div className="card-meta">
                      <span className="meta-pill"><Icon name="clock" size={12} /> {e.time}</span>
                      <span className="meta-pill">{e.guru}</span>
                    </div>
                    <p><strong>{t("प्रधान कृति:")}</strong> {e.work}</p>
                  </div>
                </article>
              </Reveal>
            ))}
          </div>

          {items.length > visible ? (
            <div className="load-more-wrap">
              <button className="btn secondary" onClick={() => setVisible((v) => v + 24)}>
                {t("Load More Records")} <Icon name="chevronDown" size={16} />
              </button>
            </div>
          ) : (
            <p className="count-note" style={{ textAlign: "center", marginTop: 34 }}>
              {t("All {n} records shown", { n: items.length })}
            </p>
          )}
        </>
      )}
    </div>
  );
}

/* ---------- Cloudinary PDF upload (unsigned preset, browser-side) ----------
   Files go to Cloudinary via the unsigned upload preset; the returned
   secure_url is written into the entry's `pdf` field, so it is
   saved/published like any other edit. No API key/secret in the client. */
const CLOUDINARY_CLOUD = "frlcy0sc";
const CLOUDINARY_UPLOAD_PRESET = "jainism";
function cloudinaryUpload(file, resourceType) {
  const body = new FormData();
  body.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  body.append("file", file);
  return fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD + "/" + resourceType + "/upload",
    { method: "POST", body: body }).then(function (res) {
      return res.json().catch(function () { return null; }).then(function (json) {
        if (json && json.secure_url) return { url: json.secure_url };
        throw new Error((json && json.error && json.error.message) || ("Upload failed (HTTP " + res.status + ")"));
      });
    });
}
function uploadPdfToCloudinary(file) {
  /* the preset may be registered for the image or the raw resource type —
     try image first (PDFs are image-type assets), fall back to raw */
  return cloudinaryUpload(file, "image").catch(function (firstErr) {
    return cloudinaryUpload(file, "raw").catch(function (secondErr) {
      throw new Error((firstErr && firstErr.message ? firstErr.message : firstErr) +
        " / " + (secondErr && secondErr.message ? secondErr.message : secondErr));
    });
  }).then(function (r) { return r.url; });
}
function PdfUpload({ onChange }) {
  const inputRef = useRef(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [err, setErr] = useState("");
  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (file.size > 100 * 1024 * 1024) {
      setErr("File is larger than 100 MB — Cloudinary's limit."); setMsg(""); return;
    }
    if (file.type && file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) {
      setErr("Please choose a PDF file."); setMsg(""); return;
    }
    setErr(""); setBusy(true); setMsg("Uploading " + file.name + " …");
    uploadPdfToCloudinary(file).then(function (url) {
      onChange(url);
      setBusy(false);
      setMsg("Uploaded ✓ " + file.name + " — press Save to keep it.");
    }).catch(function (e2) {
      setBusy(false); setMsg("");
      setErr("Upload failed: " + (e2 && e2.message ? e2.message : e2));
    });
  };
  return (
    <span className="adm-pdfupload">
      <input ref={inputRef} type="file" accept=".pdf,application/pdf" style={{ display: "none" }} onChange={onFile} />
      <button type="button" className="btn small" disabled={busy}
        onClick={() => { if (inputRef.current) inputRef.current.click(); }}>
        {busy ? "Uploading…" : "Upload PDF"}
      </button>
      {msg ? <small>{msg}</small> : null}
      {err ? <small className="adm-err">{err}</small> : null}
    </span>
  );
}

        <button className="adm-mini" title="Move down" onClick={() => onMove(1)}>{'↓'}</button>
        <button className="adm-mini" title="Duplicate" onClick={onDuplicate}>{'⧉'}</button>
        <button className="adm-mini" title="Delete" onClick={onRemove}>{'✕'}</button>
        <button className="adm-mini" title={open ? "Collapse" : "Edit"} onClick={onToggle}>{open ? '−' : '✎'}</button>
      </div>
      {open ? (
        <div className="adm-entry-body">
          {keys.map((k) => (
            <AdminField key={k} name={k} value={entry[k]}
              onChange={(v) => setField(k, v)} />
          ))}
          {keys.length === 0 ? <div className="adm-empty">Empty object — use "+ Add field" below.</div> : null}
          {adding ? (
            <div className="adm-addrow">
              <input className="adm-key" placeholder="field name (e.g. pdf)" value={nk}
                onChange={(e) => setNk(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addField(); } }} />
              <input className="adm-val" placeholder="value (text or link)" value={nv}
                onChange={(e) => setNv(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addField(); } }} />
              <button className="btn small" onClick={addField}>Add</button>
              <button className="btn ghost small" onClick={() => setAdding(false)}>Cancel</button>
            </div>
          ) : (
            <div className="adm-addrow">
              <button className="btn ghost small" onClick={() => setAdding(true)}>+ Add field</button>
            </div>
          )}
        </div>
      ) : null}
    </div>
  );
}
function AdminPanel({ onClose }) {
  const [snap, setSnap] = useState(function () { return contentSnapshot(); });
  const [sectionKey, setSectionKey] = useState("site");
  const [q, setQ] = useState("");
  const [limit, setLimit] = useState(40);
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [openMap, setOpenMap] = useState({});
  const [allOpen, setAllOpen] = useState(false);
  const section = CONTENT_SECTIONS.find((s) => s.key === sectionKey) || CONTENT_SECTIONS[0];
  const data = snap[section.key];

  const update = (next) => { setSnap(next); setDirty(true); setStatus(""); };
  const setData = (value) => update(Object.assign({}, snap, { [section.key]: value }));
  const isOpen = (i) => (openMap[i] !== undefined ? openMap[i] : (allOpen || (!!q && idxs.length === 1)));
  const toggleOpen = (i) => setOpenMap((m) => Object.assign({}, m, { [i]: !isOpen(i) }));
  const exportSection = () => {
    const text = JSON.stringify(snap[section.key], null, 2);
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      setStatus(ok ? "Section JSON copied to clipboard." : "Copy blocked by the browser — reopen and try again.");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setStatus("Section JSON copied to clipboard.");
      }, fallback);
    } else fallback();
  };
  const importSection = () => {
    const text = window.prompt('Paste JSON to replace "' + section.label + '":');
    if (!text) return;
    try {
      const v = JSON.parse(text);
      if (section.kind === "array" && !Array.isArray(v)) throw new Error("This section expects a JSON array [ … ].");
      if (section.kind !== "array" && (Array.isArray(v) || typeof v !== "object" || !v)) throw new Error("This section expects a JSON object { … }.");
      update(Object.assign({}, snap, { [section.key]: v }));
      setStatus('JSON imported for "' + section.label + '" — press Save (this browser) to apply.');
    } catch (e) {
      window.alert("Import failed: " + e.message);
    }
  };
  const revertSection = () => {
    if (!window.confirm('Revert "' + section.label + '" to its built-in default content?')) return;
    update(Object.assign({}, snap, { [section.key]: JSON.parse(JSON.stringify(BUILTIN_DEFAULTS[section.key])) }));
    setStatus('Section "' + section.label + '" reverted — press Save (this browser) to apply.');
  };
  const setEntry = (i, entry) => { const arr = data.slice(); arr[i] = entry; setData(arr); };
  const removeEntry = (i) => { if (!window.confirm("Delete entry #" + (i + 1) + " (" + adminEntryLabel(data[i]) + ")?")) return; const arr = data.slice(); arr.splice(i, 1); setData(arr); };
  const dupEntry = (i) => { const arr = data.slice(); arr.splice(i + 1, 0, JSON.parse(JSON.stringify(arr[i]))); setData(arr); };
  const moveEntry = (i, dir) => { const arr = data.slice(); const j = i + dir; if (j < 0 || j >= arr.length) return; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; setData(arr); };
  const addEntry = () => {
    const arr = data.slice();
    const base = arr.length ? JSON.parse(JSON.stringify(arr[0])) : {};
    Object.keys(base).forEach((k) => {
      const v = base[k];
      if (typeof v === "string") base[k] = "";
      else if (typeof v === "number") base[k] = 0;
      else if (Array.isArray(v)) base[k] = [];
      else if (v && typeof v === "object") base[k] = {};
    });
    if ("id" in base) base.id = "new-" + Date.now();
    arr.push(base);
    setData(arr);
  };

  const saveLocal = () => {
    setBusy(true);
    setStatus("Saving locally…");
    try {
      window.localStorage.setItem(CONTENT_LOCAL_KEY, JSON.stringify(snap));
      setStatus("Saved locally — reloading…");
      setTimeout(function () { window.location.reload(); }, 400);
    } catch (e) {
      setBusy(false);
      setStatus("Local save failed: " + e.message);
    }
  };
  const publish = () => {
    setBusy(true);
    setStatus("Publishing to Firebase…");
    try { window.localStorage.setItem(CONTENT_LOCAL_KEY, JSON.stringify(snap)); } catch (e) {}
    publishContentToCloud(snap).then(function () {
      setStatus("Published to Firebase — reloading…");
      setTimeout(function () { window.location.reload(); }, 500);
    }).catch(function (e) {
      setBusy(false);
      setStatus("Saved locally, but Firebase publish failed: " + (e && e.message ? e.message : e) +
        " — check Firestore rules (collection ‘" + CONTENT_COLLECTION + "’) and your network.");
    });
  };
  const resetAll = () => {
    if (!window.confirm("Reset ALL sections to the built-in defaults? (Cloud copy stays unless you publish again.)")) return;
    try { window.localStorage.removeItem(CONTENT_LOCAL_KEY); } catch (e) {}
    setStatus("Local overrides cleared — reloading…");
    setTimeout(function () { window.location.reload(); }, 400);
  };
  const close = () => { if (dirty && !window.confirm("You have unsaved edits. Close anyway?")) return; onClose(); };
  useEffect(() => {
    const h = (e) => {
      if (e.key === "Escape") close();
      if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
        e.preventDefault();
        saveLocal();
      }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  });

  const isArr = section.kind === "array" && Array.isArray(data);
  const idxs = isArr ? data.map((e, i) => i).filter((i) => {
    if (!q) return true;
    try { return JSON.stringify(data[i]).toLowerCase().replace(/\u2011/g, "-").indexOf(q.toLowerCase()) !== -1; } catch (e) { return false; }
  }) : [];
  const shown = q ? idxs : idxs.slice(0, limit);

  return (
    <div className="admin-mount">
      <div className="admin-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) close(); }}>
        <div className="admin-panel" role="dialog" aria-label="Admin panel">
          <div className="adm-head">
            <h2>Admin Panel{dirty ? <span className="adm-dirty">● Unsaved changes</span> : null}<span className="adm-sub">12 logo clicks · edits save to this browser + Firebase “{CONTENT_COLLECTION}”</span></h2>
            <button className="btn ghost small" onClick={close}>Close (Esc)</button>
          </div>
          <div className="adm-body">
            <nav className="adm-side" aria-label="Sections">
              {CONTENT_SECTIONS.map((s) => (
                <button key={s.key} className={s.key === section.key ? "on" : ""}
                  onClick={() => { setSectionKey(s.key); setQ(""); setLimit(40); setOpenMap({}); setAllOpen(false); }}>
                  {s.label}
                  <span className="adm-count">{s.kind === "array" && Array.isArray(snap[s.key]) ? snap[s.key].length : "⚙"}</span>
                </button>
              ))}
            </nav>
            <main className="adm-main">
              <div className="adm-toolbar">
                {isArr ? (
                  <>
                    <input type="search" placeholder={"Search " + section.label + "…"} value={q}
                      onChange={(e) => setQ(e.target.value)} aria-label="Search entries" />
                    <button className="btn secondary small" onClick={addEntry}>+ Add entry</button>
                    <span className="count-note">{isArr ? data.length : 0} entries</span>
                  </>
                ) : (
                  <span className="count-note">Site-wide strings — name, tagline, contact, social links.</span>
                )}
              </div>
              {isArr ? (
                shown.length === 0 ? (
                  <div className="adm-empty">No entries match “{q}”.</div>
                ) : (
                  <>
                    {shown.map((i) => (
                      <AdminEntryCard key={i} index={i} entry={data[i]}
                        open={isOpen(i)}
                        onToggle={() => toggleOpen(i)}
                        onChange={(e2) => setEntry(i, e2)}
                        onRemove={() => removeEntry(i)}
                        onDuplicate={() => dupEntry(i)}
                        onMove={(d) => moveEntry(i, d)} />
                    ))}
                    {!q && idxs.length > shown.length ? (
                      <div style={{ textAlign: "center", marginTop: 14 }}>
                        <button className="btn secondary small" onClick={() => setLimit((l) => l + 60)}>
                          Show more ({shown.length} of {idxs.length})
                        </button>
                      </div>
                    ) : null}
                  </>
                )
              ) : (
                <div className="adm-entry">
                  <div className="adm-entry-body">
                    {data && typeof data === "object" ? Object.keys(data).map((k) => (
                      <AdminField key={k} name={k} value={data[k]}
                        onChange={(v) => setData(Object.assign({}, data, { [k]: v }))} />
                    )) : <div className="adm-empty">No data.</div>}
                  </div>
                </div>
              )}
            </main>
          </div>
          <div className="adm-foot">
            <button className="btn small" onClick={saveLocal} disabled={busy}>Save (this browser)</button>
            <button className="btn secondary small" onClick={publish} disabled={busy}>Publish to Firebase</button>
            {isArr ? <button className="btn ghost small" onClick={() => { setAllOpen(true); setOpenMap({}); }}>Expand all</button> : null}
            {isArr ? <button className="btn ghost small" onClick={() => { setAllOpen(false); setOpenMap({}); }}>Collapse all</button> : null}
            <button className="btn ghost small" onClick={exportSection}>Copy section JSON</button>
            <button className="btn ghost small" onClick={importSection}>Paste section JSON</button>
            <button className="btn ghost small" onClick={revertSection}>Revert section</button>
            <button className="btn ghost small" onClick={resetAll} disabled={busy}>Reset to defaults</button>
            <span className="adm-status" aria-live="polite">{status}</span>
          </div>
        </div>
      </div>
    </div>
  );
}
const ADMIN_PASSWORD = "jainism@123";
function AdminGate({ onClose }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [ok, setOk] = useState(false);
  const submit = (e) => {
    if (e) e.preventDefault();
    if (pw === ADMIN_PASSWORD) { setOk(true); setErr(""); }
    else { setErr("Incorrect password"); setPw(""); }
  };
  if (ok) return <AdminPanel onClose={onClose} />;
  return (
    <div className="admin-overlay">
      <div className="adm-gate" role="dialog" aria-label="Admin password">
        <h2>Admin access</h2>
        <p>Enter the password to edit this website.</p>
        <form onSubmit={submit}>
          <input type="password" autoFocus value={pw} placeholder="Password"
            aria-label="Admin password"
            onChange={(e) => { setPw(e.target.value); setErr(""); }} />
          <div className="adm-gate-actions">
            <button type="submit" className="btn small">Unlock</button>
            <button type="button" className="btn ghost small" onClick={onClose}>Cancel</button>
          </div>
        </form>
        {err ? <em className="adm-err">{err}</em> : null}
      </div>
    </div>
  );
}
let __adminMountEl = null;
let __adminReactRoot = null;
function openAdminPanel() {
  if (__adminReactRoot) return;
  __adminMountEl = document.createElement("div");
  __adminMountEl.className = "admin-mount";
  document.body.appendChild(__adminMountEl);
  lockPageScroll();
  __adminReactRoot = ReactDOM.createRoot(__adminMountEl);
  const close = () => {
    try { __adminReactRoot.render(null); } catch (e) {}
    if (__adminMountEl && __adminMountEl.parentNode) __adminMountEl.parentNode.removeChild(__adminMountEl);
    unlockPageScroll();
    __adminReactRoot = null;
    __adminMountEl = null;
  };
  __adminReactRoot.render(<AdminGate onClose={close} />);
}
/* the gate: 12 clicks on any .brand logo (header or footer) */
(function adminGate() {
  let clicks = 0;
  let timer = 0;
  document.addEventListener("click", function (e) {
    const brand = e.target && e.target.closest ? e.target.closest(".brand") : null;
    if (!brand) return;
    clicks += 1;
    window.clearTimeout(timer);
    timer = window.setTimeout(function () { clicks = 0; }, 1500);
    if (clicks >= 12) {
      clicks = 0;
      window.clearTimeout(timer);
      openAdminPanel();
    }
  });
})();
/* test/backup entry point: ?admin=1 or #admin */
if (/[?&]admin=1/.test(window.location.search) || window.location.hash === "#admin") {
  setTimeout(openAdminPanel, 600);
}
syncContentFromCloud();

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
