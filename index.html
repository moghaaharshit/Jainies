  const [modalOpen, setModalOpen] = useState(false);
  usePendingDetail("acharya", setSelected);

  const items = useMemo(() => {
    const term = q.trim().toLowerCase();
    return acharyaProfiles.filter((p) => {
      const okT = tradition === "All traditions" || p.tradition.indexOf(tradition) !== -1;
      const okP = period === "All periods" || p.periodKey === period;
      const okQ = !term || (p.name + " " + p.title + " " + p.works + " " + p.bio + " " + p.tradition).toLowerCase().indexOf(term) !== -1;
      return okT && okP && okQ;
    });
  }, [q, tradition, period]);

  const current = selected ? acharyaProfiles.find((p) => p.id === selected) : null;
  const reset = () => { setQ(""); setTradition("All traditions"); setPeriod("All periods"); };

  return (
    <div className="page-enter">
      <PageHero canvas eyebrow="Teachers, lineages &amp; succession"
        title="The <em>Acharya</em> Parampara"
        lead="Discover the teachers, lineages and philosophical traditions that have carried Jain knowledge across generations." />

      <section className="section tight">
        <div className="container">
          <Reveal className="center-block">
            <div className="eyebrow center">Why the parampara matters</div>
            <h2 className="section-title">Knowledge survives through <em>teachers</em></h2>
            <p className="section-lead">
              Jainism has never had a single central authority. What has held the tradition together
              instead is the parampara — the succession of acharyas who train monks and nuns, decide
              questions of practice, and comment on the texts. Because several such successions exist,
              this page draws them as separate branches rather than one unbroken line.
            </p>
            <hr className="gold-divider center" />
          </Reveal>

          <div className="toolbar" style={{ marginTop: 34 }}>
            <div className="field grow">
              <Icon name="search" size={16} />
              <input type="search" value={q} onChange={(e) => setQ(e.target.value)}
                placeholder="Search Acharya names, works, traditions…" aria-label="Search Acharyas" />
            </div>
            <div className="field select-wrap">
              <select value={tradition} onChange={(e) => setTradition(e.target.value)} aria-label="Filter by tradition">
                {["All traditions", "Shvetambara", "Digambara", "Terapanth"].map((o) => <option key={o} value={o}>Tradition: {o}</option>)}
              </select>
            </div>
            <div className="field select-wrap">
              <select value={period} onChange={(e) => setPeriod(e.target.value)} aria-label="Filter by period">
                {["All periods", ...ACHARYA_PERIODS].map((o) => <option key={o} value={o}>Period: {o}</option>)}
              </select>
            </div>
            <button className="btn secondary small" onClick={reset}>Reset Filters</button>
          </div>

          <LineageTree selectedId={selected} onSelect={(id) => setSelected(id === selected ? null : id)} query={q} />

          {current ? (
            <div className="lineage-shell" style={{ marginTop: 26 }}>
              <div className="lineage-detail">
                <div className="seal" aria-hidden="true">{current.name.split(" ").slice(-1)[0].charAt(0)}</div>
                <div>
                  <div className="modal-sub">{current.title}</div>
                  <h3 style={{ fontSize: "1.8rem" }}>{current.name}</h3>
                  <div className="card-meta" style={{ margin: "10px 0 14px" }}>
                    <span className="meta-pill">{current.tradition}</span>
                    <span className="meta-pill"><Icon name="clock" size={12} /> {current.period}</span>
                    <span className="meta-pill"><Icon name="pin" size={12} /> {current.region}</span>
                  </div>
                  <p style={{ color: "var(--text-soft)" }}>{current.bio}</p>
                  <p style={{ fontSize: ".9rem" }}><strong>Works &amp; contributions:</strong> {current.works}</p>
                  <p style={{ fontSize: ".88rem", color: "var(--text-faint)" }}><strong>Lineage note:</strong> {current.lineageNote}</p>
                  <div className="card-foot">
                    <span className="count-note">{current.sources.join(" · ")}</span>
                    <button className="btn ghost small" onClick={() => setModalOpen(true)}>Full profile <Icon name="arrowRight" size={15} /></button>
                  </div>
                </div>
              </div>
            </div>
          ) : null}

          <div className="toolbar" style={{ marginTop: 46 }}>
            <p className="count-note" role="status">{items.length} of {acharyaProfiles.length} profiles</p>
          </div>
          {items.length === 0 ? (
            <div className="empty-state"><h3>No Acharyas match</h3><p>Try another tradition or period.</p>
              <button className="btn small" onClick={reset}>Reset Filters</button></div>
          ) : (
            <div className="grid cols-3">
              {items.map((p, i) => (
                <Reveal key={p.id} delay={"d" + ((i % 3) + 1)}>
                  <article className="card">
                    <div className="card-body">
                      <div className="card-kicker">{p.tradition}</div>
                      <h3>{p.name}</h3>
                      <div className="script-line">{p.title}</div>
                      <div className="card-meta">
                        <span className="meta-pill"><Icon name="clock" size={12} /> {p.period}</span>
                        <span className="meta-pill"><Icon name="pin" size={12} /> {p.region}</span>
                      </div>
                      <p>{p.bio}</p>
                      <div className="card-foot">
                        <span className="verify ok"><Icon name="check" size={12} /> {p.sources.length} source(s)</span>
                        <button className="btn ghost small" onClick={() => setSelected(p.id)}>
                          Show in lineage <Icon name="tree" size={15} />
                        </button>
                      </div>
                    </div>
                  </article>
                </Reveal>
              ))}
            </div>
          )}
        </div>
      </section>

      <DetailModal open={modalOpen && !!current} onClose={() => setModalOpen(false)}
        title={current ? current.name : ""}
        subtitle={current ? current.title + " · " + current.period : ""}
        imageTitle={current ? current.wiki : null} imageAlt={current ? current.name : ""}
        body={current ? (
          <>
            <p style={{ fontSize: "1.06rem" }}>{current.bio}</p>
            <p><strong>Works &amp; contributions:</strong> {current.works}</p>
            <p><strong>Lineage note:</strong> {current.lineageNote}</p>
          </>
        ) : null}
        facts={current ? [
          { k: "Tradition", v: current.tradition },
          { k: "Period", v: current.period },
          { k: "Region", v: current.region },
          { k: "Title", v: current.title }
        ] : []}
        refs={current ? current.sources : []}
        footerNote="Lineage columns are kept separate by tradition; unverified teacher-student links are not shown."
        prevLabel="Previous Acharya" nextLabel="Next Acharya"
        onPrev={current && items.findIndex((p) => p.id === current.id) > 0 ? () => { const i = items.findIndex((p) => p.id === current.id); setSelected(items[i - 1].id); } : null}
        onNext={current && items.findIndex((p) => p.id === current.id) < items.length - 1 ? () => { const i = items.findIndex((p) => p.id === current.id); setSelected(items[i + 1].id); } : null} />
    </div>
  );
}
/* ============================================================
   17. BLOG PAGE + ARTICLE VIEW
   ============================================================ */
function BlogPage() {
  const [cat, setCat] = useState("All categories");
  const [q, setQ] = useState("");
  const [visible, setVisible] = useState(6);

  const items = useMemo(() => {
    const term = q.trim().toLowerCase();
    return blogArticles.filter((a) => {
      const okC = cat === "All categories" || a.category === cat;
      const okQ = !term || (a.title + " " + a.excerpt + " " + a.category).toLowerCase().indexOf(term) !== -1;
      return okC && okQ;
    });
  }, [cat, q]);

  const featured = items[0];
  const rest = items.slice(1, visible);
  const reset = () => { setCat("All categories"); setQ(""); setVisible(6); };

  return (
    <div className="page-enter">
      <PageHero canvas eyebrow="The editorial journal"
        title="Stories, Wisdom &amp; <em>Heritage</em>"
        lead="Thoughtful articles exploring Jain philosophy, historical discoveries, sacred literature and cultural traditions." />

      <section className="section">
        <div className="container">
          <div className="accuracy-note" style={{ marginBottom: 34 }}>
            <Icon name="info" size={19} />
            <div>
              <strong>Demo content.</strong> Every article below is sample copy written for this build.
              Authors are credited to the demo editorial team, dates are sample publication dates, and no
              real research claim or citation is made on their behalf.
            </div>
          </div>

          <div className="toolbar">
            <div className="chip-row" role="group" aria-label="Filter articles by category">
              <button className="chip" aria-pressed={cat === "All categories"} onClick={() => setCat("All categories")}>All Categories</button>
              {BLOG_CATEGORIES.map((c) => (
                <button key={c} className="chip" aria-pressed={cat === c} onClick={() => setCat(c)}>{c}</button>
              ))}
            </div>
            <div className="field grow">
              <Icon name="search" size={16} />
              <input type="search" value={q} onChange={(e) => setQ(e.target.value)}
                placeholder="Search articles…" aria-label="Search articles" />
            </div>
          </div>

          {items.length === 0 ? (
            <div className="empty-state"><h3>No articles found</h3><p>Try another category or a shorter search.</p>
              <button className="btn small" onClick={reset}>Reset Filters</button></div>
          ) : (
            <>
              {featured ? (
                <Reveal>
                  <div className="featured-article">
                    <div className="fa-media">
                      <HeritageImage title={featured.imageWiki} alt={featured.title + " — hero illustration"} eager />
                    </div>
                    <div className="fa-body">
                      <span className="badge-demo">Featured · Demo content</span>
                      <div className="cat-label">{featured.category}</div>
                      <h2>{featured.title}</h2>
                      <p style={{ color: "var(--text-soft)" }}>{featured.excerpt}</p>
                      <div className="byline">
                        <span><Icon name="user" size={12} /> {featured.author}</span>
                        <span><Icon name="calendar" size={12} /> {new Date(featured.date).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}</span>
                        <span><Icon name="clock" size={12} /> {featured.readTime}</span>
                      </div>
                      <div className="hero-actions" style={{ marginTop: 8 }}>
                        <button className="btn small" onClick={() => navigate("/blog/" + featured.slug)}>
                          Read Article <Icon name="arrowRight" size={15} />
                        </button>
                      </div>
                    </div>
                  </div>
                </Reveal>
              ) : null}

              <div className="grid cols-3" style={{ marginTop: 34 }}>
                {rest.map((a, i) => (
                  <Reveal key={a.slug} delay={"d" + ((i % 3) + 1)}>
                    <BlogCard article={a} onOpen={() => navigate("/blog/" + a.slug)} />
                  </Reveal>
                ))}
              </div>

              {items.length - 1 > visible ? (
                <div className="load-more-wrap">
                  <button className="btn secondary" onClick={() => setVisible((v) => v + 6)}>
                    Load More Articles <Icon name="chevronDown" size={16} />
                  </button>
                </div>
              ) : (
                <p className="count-note" style={{ textAlign: "center", marginTop: 34 }}>
                  All {items.length} article{items.length === 1 ? "" : "s"} shown
                </p>
              )}
            </>
          )}
        </div>
      </section>
    </div>
  );
}

function ArticlePage({ slug }) {
  const article = blogArticles.find((a) => a.slug === slug);
  const [activeHeading, setActiveHeading] = useState("");

  useEffect(() => {
    if (!article) return undefined;
    const ids = article.sections.map((s, i) => "sec-" + i);
    const onScroll = () => {
      let current = ids[0];
      ids.forEach((id) => {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top < 160) current = id;
      });
      setActiveHeading(current);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, [slug]);

  if (!article) {
    return (
      <section className="section article-view">
        <div className="container narrow empty-state">
          <h3>Article not found</h3>
          <p>The article you are looking for does not exist (or has been renamed).</p>
          <Link to="/blog" className="btn small">Back to Blog</Link>
        </div>
      </section>
    );
  }

  const related = (article.related || []).map((s) => blogArticles.find((a) => a.slug === s)).filter(Boolean);

  return (
    <article className="page-enter article-view">
      <div className="container narrow">
        <Link to="/blog" className="back-link"><Icon name="arrowLeft" size={15} /> Back to Blog</Link>
        <div className="card-meta" style={{ margin: "18px 0 12px" }}>
          <span className="cat-label">{article.category}</span>
          {article.demo ? <span className="badge-demo">Demo content</span> : null}
        </div>
        <h1 style={{ fontSize: "clamp(2rem,5vw,3.3rem)" }}>{article.title}</h1>
        <div className="byline" style={{ margin: "16px 0", fontSize: ".86rem" }}>
          <span><Icon name="user" size={13} /> {article.author}</span>
          <span><Icon name="calendar" size={13} /> {new Date(article.date).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}</span>
          <span><Icon name="clock" size={13} /> {article.readTime}</span>
        </div>
        <div className="article-hero">
          <HeritageImage title={article.imageWiki} alt={article.title + " — hero image"} eager />
        </div>
      </div>

      <div className="container">
        <div className="article-layout">
          <nav className="toc" aria-label="Table of contents">
            <h4>Table of Contents</h4>
            {article.sections.map((s, i) => (
              <a key={i} href={"#sec-" + i} className={activeHeading === "sec-" + i ? "active" : ""}
                onClick={(e) => {
                  e.preventDefault();
                  const el = document.getElementById("sec-" + i);
                  if (el) { el.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "start" }); el.focus({ preventScroll: true }); }
                }}>{s.h}</a>
            ))}
            <h4 style={{ marginTop: 18 }}>Sources</h4>
            <a href="#sec-sources" className={activeHeading === "sec-sources" ? "active" : ""}
              onClick={(e) => {
                e.preventDefault();
                const el = document.getElementById("sec-sources");
                if (el) el.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "start" });
              }}>References</a>
          </nav>

          <div>
            <div className="prose">
              <p style={{ fontSize: "1.14rem", color: "var(--text)" }}>{article.excerpt}</p>
              {article.sections.map((s, i) => (
                <section key={i}>
                  <h2 id={"sec-" + i}>{s.h}</h2>
                  {s.p.map((para, j) => <p key={j}>{para}</p>)}
                </section>
              ))}
              <section id="sec-sources">
                <h2>Sources &amp; References</h2>
                <ul className="sources-list">
                  {article.sources.map((s, i) => <li key={i}>{s}</li>)}
                  <li>Demo article — written for this build; not a published research piece.</li>
                </ul>
              </section>
            </div>

            {related.length ? (
              <div style={{ marginTop: 46 }}>
                <div className="eyebrow">Related articles</div>
                <div className="related-grid" style={{ marginTop: 18 }}>
                  {related.map((a) => (
                    <button key={a.slug} className="card" style={{ textAlign: "left", cursor: "pointer", border: "1px solid var(--line)" }}
                      onClick={() => navigate("/blog/" + a.slug)}>
                      <div className="card-body">
                        <div className="cat-label">{a.category}</div>
                        <h3 style={{ fontSize: "1.15rem" }}>{a.title}</h3>
                        <p style={{ fontSize: ".84rem" }}>{a.excerpt.slice(0, 90)}…</p>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            ) : null}

            <div style={{ marginTop: 40, borderTop: "1px solid var(--line)", paddingTop: 24 }}>
              <Link to="/blog" className="btn secondary"><Icon name="arrowLeft" size={15} /> Back to Blog</Link>
            </div>
          </div>
        </div>
      </div>
    </article>
  );
}
/* ============================================================
   18. APP SHELL — router, theme, chrome
   ============================================================ */
function NotFound({ route }) {
  return (
    <section className="section page-enter" style={{ paddingTop: "calc(var(--header-h) + 90px)" }}>
      <div className="container narrow empty-state">
        <div className="section-icon" style={{ margin: "0 auto 16px" }}><Icon name="lotus" size={22} /></div>
        <h3>This path doesn't exist</h3>
        <p>The address <code>{route}</code> isn't part of the archive — it may be a deep link that needs server configuration when hosted.</p>
        <div className="hero-actions" style={{ justifyContent: "center" }}>
          <Link to="/" className="btn small">Go to Home</Link>
          <Link to="/timeline" className="btn secondary small">Open the Timeline</Link>
        </div>
      </div>
    </section>
  );
}

const TITLES = {
  "/": "Jain Heritage — History, Timeline, Rulers, Granths & Acharya Parampara",
  "/timeline": "The Living Timeline of Jainism · Jain Heritage",
  "/jain-rulers": "Rulers, Patrons & Kingdoms · Jain Heritage",
  "/freedom-fighters": "Voices of Courage & Freedom · Jain Heritage",
  "/jain-granths": "The Wisdom of Jain Granths · Jain Heritage",
  "/acharya-parampara": "The Acharya Parampara · Jain Heritage",
  "/blog": "Stories, Wisdom & Heritage · Jain Heritage"
};

function App() {
  const route = useRoute();
  const [searchOpen, setSearchOpen] = useState(false);
  const [theme, setTheme] = useState(() => {
    try {
      const saved = window.localStorage.getItem("jh-theme");
      if (saved) return saved;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) { return "light"; }
  });

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { window.localStorage.setItem("jh-theme", theme); } catch (e) { /* storage unavailable */ }
  }, [theme]);

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: "auto" });
    if (TITLES[route]) document.title = TITLES[route];
    else if (route.indexOf("/blog/") === 0) {
      const a = blogArticles.find((x) => x.slug === route.slice("/blog/".length));
      document.title = (a ? a.title : "Article") + " · Jain Heritage";
    } else document.title = "Jain Heritage";
  }, [route]);

  /* keyboard: ⌘K / Ctrl+K / "/" opens search */
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      if ((e.key === "k" && (e.metaKey || e.ctrlKey)) || e.key === "/") {
        e.preventDefault();
        setSearchOpen(true);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  let page;
  if (route === "/") page = <HomePage />;
  else if (route === "/timeline") page = <TimelinePage />;
  else if (route === "/jain-rulers") page = <RulersPage />;
  else if (route === "/freedom-fighters") page = <FreedomFightersPage />;
  else if (route === "/jain-granths") page = <GranthsPage />;
  else if (route === "/acharya-parampara") page = <AcharyaPage />;
  else if (route === "/blog") page = <BlogPage />;
  else if (route.indexOf("/blog/") === 0) page = <ArticlePage slug={route.slice("/blog/".length)} />;
  else page = <NotFound route={route} />;

  return (
    <>
      <Header route={route} theme={theme}
        toggleTheme={() => setTheme(theme === "dark" ? "light" : "dark")}
        onSearch={() => setSearchOpen(true)} />
      <main id="main">{page}</main>
      <Footer />
      <SearchModal open={searchOpen} onClose={() => setSearchOpen(false)} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
