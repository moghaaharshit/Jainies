<style>
/* ============================================================
   JAIN HERITAGE — DESIGN SYSTEM
   Palette inspired by ivory manuscript paper, maroon ink,
   saffron, forest green and muted gold leaf.
   ============================================================ */
:root{
  --ivory:#FAF7F0;
  --paper:#F0E6D2;
  --maroon:#632B35;
  --saffron:#D99A32;
  --green:#315A48;
  --ink:#24231F;
  --gold:#B99A58;
  --white:#FFFFFF;

  --bg:var(--ivory);
  --bg-alt:var(--paper);
  --surface:#FFFFFF;
  --surface-2:#FBF8F1;
  --text:var(--ink);
  --text-soft:#55524A;
  --text-faint:#7C776B;
  --line:rgba(36,35,31,.14);
  --line-strong:rgba(36,35,31,.28);
  --accent:var(--maroon);
  --accent-2:var(--saffron);
  --accent-3:var(--green);
  --gold-line:linear-gradient(90deg,transparent,rgba(185,154,88,.75),transparent);
  --shadow-sm:0 2px 10px rgba(36,35,31,.06);
  --shadow-md:0 14px 40px -18px rgba(36,35,31,.30);
  --shadow-lg:0 32px 70px -30px rgba(36,35,31,.40);
  --radius:14px;
  --radius-lg:22px;
  --header-h:72px;
  --font-serif:"Cormorant Garamond",Georgia,serif;
  --font-editorial:"Playfair Display",Georgia,serif;
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
[data-theme="dark"]{
  --bg:#171612;
  --bg-alt:#1E1C17;
  --surface:#22201A;
  --surface-2:#26241D;
  --text:#EFE8D9;
  --text-soft:#BEB6A5;
  --text-faint:#9A927F;
  --line:rgba(239,232,217,.16);
  --line-strong:rgba(239,232,217,.32);
  --accent:#D99A32;
  --accent-2:#E7B85E;
  --accent-3:#7FB79B;
  --shadow-sm:0 2px 10px rgba(0,0,0,.35);
  --shadow-md:0 16px 44px -18px rgba(0,0,0,.65);
  --shadow-lg:0 34px 80px -34px rgba(0,0,0,.75);
  --gold-line:linear-gradient(90deg,transparent,rgba(215,178,100,.6),transparent);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
/* scrollbars are hidden everywhere; wheel/touch scrolling still works */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-sans);
  font-size:16.5px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  transition:background .45s var(--ease),color .45s var(--ease);
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-serif);font-weight:600;line-height:1.15;margin:0;letter-spacing:-.01em}
p{margin:0 0 1em}
::selection{background:rgba(217,154,50,.28)}

/* ---------- Hindi (Devanagari) typography safeguards ---------- */
/* letter-spacing tears Devanagari aksharas apart - no tracking while the site is in Hindi */
html[lang="hi"] body, html[lang="hi"] body *,
html[lang="hi"] body *::before, html[lang="hi"] body *::after { letter-spacing: normal !important; }
/* never split compound words mid-word (e.g. आगम‑संहिता); break only as a last resort */
body { word-break: keep-all; overflow-wrap: break-word; line-break: strict; }

:focus-visible{outline:2px solid var(--saffron);outline-offset:3px;border-radius:4px}

.container{width:min(1200px,92vw);margin:0 auto}
.container.narrow{width:min(900px,92vw)}
.section{padding:clamp(64px,9vw,120px) 0;position:relative}
.section.tight{padding:clamp(44px,6vw,78px) 0}

.skip-link{position:absolute;left:-9999px;top:0;background:var(--maroon);color:#fff;padding:12px 18px;z-index:999;border-radius:0 0 8px 0}
.skip-link:focus{left:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- editorial typography ---------- */
.eyebrow{
  font-family:var(--font-sans);font-size:.72rem;font-weight:600;letter-spacing:.32em;
  text-transform:uppercase;color:var(--accent-2);display:flex;align-items:center;gap:14px;
}
.eyebrow::after{content:"";height:1px;flex:1;max-width:110px;background:var(--gold-line)}
.eyebrow.center{justify-content:center}
.eyebrow.center::before{content:"";height:1px;flex:1;max-width:110px;background:var(--gold-line)}
.section-title{font-size:clamp(2.1rem,4.4vw,3.4rem);margin:.35em 0 .4em}
.section-title em{font-family:var(--font-editorial);font-style:italic;color:var(--maroon);font-weight:500}
[data-theme="dark"] .section-title em{color:var(--saffron)}
.section-lead{font-size:clamp(1rem,1.3vw,1.12rem);color:var(--text-soft);max-width:66ch}
.gold-divider{height:1px;background:var(--gold-line);border:0;margin:26px 0;max-width:280px}
.gold-divider.center{margin:26px auto;max-width:420px}
.center-block{text-align:center;display:flex;flex-direction:column;align-items:center}
.center-block .section-lead{margin-inline:auto}

/* ---------- buttons ---------- */
.btn{
  --btn-bg:var(--maroon);--btn-fg:#fff;--btn-bd:var(--maroon);
  display:inline-flex;align-items:center;gap:.6em;justify-content:center;
  padding:.86em 1.6em;border-radius:999px;border:1px solid var(--btn-bd);
  background:var(--btn-bg);color:var(--btn-fg);font-size:.92rem;font-weight:500;
  letter-spacing:.02em;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .3s,color .3s,border-color .3s;
}
.btn:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.btn:active{transform:translateY(-1px)}
.btn .ico{transition:transform .35s var(--ease)}
.btn:hover .ico{transform:translateX(4px)}
.btn.secondary{--btn-bg:transparent;--btn-fg:var(--text);--btn-bd:var(--line-strong)}
.btn.secondary:hover{border-color:var(--maroon);color:var(--maroon)}
[data-theme="dark"] .btn.secondary:hover{border-color:var(--saffron);color:var(--saffron)}
.btn.ghost{--btn-bg:transparent;--btn-fg:var(--maroon);--btn-bd:transparent;padding:.5em .2em}
[data-theme="dark"] .btn.ghost{--btn-fg:var(--saffron)}
.btn.small{padding:.55em 1.15em;font-size:.82rem}
.btn.saffron{--btn-bg:var(--saffron);--btn-fg:#241F14;--btn-bd:var(--saffron)}

/* ---------- chips & inputs ---------- */
.chip{
  border:1px solid var(--line);background:var(--surface);color:var(--text-soft);
  padding:.5em 1.05em;border-radius:999px;font-size:.82rem;font-weight:500;cursor:pointer;
  transition:all .3s var(--ease);white-space:nowrap;
}
.chip:hover{border-color:var(--saffron);color:var(--text);transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff;box-shadow:var(--shadow-sm)}
[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--saffron);border-color:var(--saffron);color:#20201A}
.chip-row{display:flex;flex-wrap:wrap;gap:10px}
.field{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:.55em 1.1em;
  transition:border-color .3s,box-shadow .3s;min-width:0;
}
.field:focus-within{border-color:var(--saffron);box-shadow:0 0 0 4px rgba(217,154,50,.16)}
.field input,.field select{
  border:0;background:transparent;color:var(--text);font-size:.92rem;width:100%;
  outline:none;font-family:var(--font-sans);min-width:0;
}
.field select{cursor:pointer;width:auto;appearance:none;padding-right:14px}
.field input::placeholder{color:var(--text-faint)}
.select-wrap{position:relative;display:flex;align-items:center}
.select-wrap::after{content:"▾";position:absolute;right:12px;color:var(--text-faint);pointer-events:none;font-size:.75rem}
.toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:34px}
.toolbar .grow{flex:1 1 260px;max-width:420px}
.count-note{font-size:.82rem;color:var(--text-faint);letter-spacing:.04em}

/* ---------- reveal animation ---------- */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.10s}.reveal.d2{transition-delay:.20s}
.reveal.d3{transition-delay:.30s}.reveal.d4{transition-delay:.40s}

/* ============================================================
   HEADER / NAVIGATION
   ============================================================ */
.site-header{
  position:fixed;inset:0 0 auto 0;z-index:80;height:var(--header-h);
  display:flex;align-items:center;
  background:transparent;border-bottom:1px solid transparent;
  transition:background .45s var(--ease),border-color .45s var(--ease),box-shadow .45s var(--ease),backdrop-filter .45s;
}
.site-header .container{display:flex;align-items:center;gap:20px;width:min(1280px,94vw)}
.site-header.scrolled{
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px) saturate(1.2);
  border-bottom-color:var(--line);
  box-shadow:0 6px 30px -22px rgba(0,0,0,.5);
}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand-mark{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(150deg,var(--maroon),#7d3a46);
  display:grid;place-items:center;box-shadow:var(--shadow-sm);
  border:1px solid rgba(185,154,88,.5);
}
[data-theme="dark"] .brand-mark{background:linear-gradient(150deg,#5b2731,#7d3a46)}
.brand-name{font-family:var(--font-serif);font-size:1.32rem;font-weight:600;letter-spacing:.01em;line-height:1}
.brand-tag{display:block;font-family:var(--font-sans);font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.main-nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav-link{
  position:relative;padding:.5em .78em;font-size:.87rem;font-weight:500;color:var(--text-soft);
  border-radius:8px;transition:color .3s,background .3s;white-space:nowrap;
}
.nav-link:hover{color:var(--text);background:rgba(185,154,88,.12)}
.nav-link.active{color:var(--maroon);font-weight:600}
[data-theme="dark"] .nav-link.active{color:var(--saffron)}
.nav-link.active::after{
  content:"";position:absolute;left:.78em;right:.78em;bottom:.15em;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--saffron),var(--gold));
  animation:navUnderline .45s var(--ease) both;
}
@keyframes navUnderline{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.icon-btn{
  width:40px;height:40px;border-radius:11px;border:1px solid transparent;background:transparent;
  display:grid;place-items:center;cursor:pointer;color:var(--text-soft);
  transition:all .3s var(--ease);position:relative;
}
.icon-btn:hover{background:rgba(185,154,88,.14);color:var(--text);border-color:var(--line);transform:translateY(-2px)}
.burger{display:none}
@media (max-width:1280px){
  .main-nav{
    position:fixed;top:var(--header-h);left:0;right:0;
    background:var(--bg);border-bottom:1px solid var(--line);
    flex-direction:column;align-items:stretch;padding:14px 5vw 26px;gap:2px;
    box-shadow:var(--shadow-lg);
    transform:translateY(-14px);opacity:0;pointer-events:none;
    transition:opacity .3s var(--ease),transform .3s var(--ease);
    max-height:calc(100vh - var(--header-h));overflow-y:auto;
  }
  .main-nav.open{transform:none;opacity:1;pointer-events:auto}
  .nav-link{padding:.85em .6em;font-size:1rem;border-bottom:1px solid var(--line);border-radius:0}
  .nav-link.active::after{left:0;right:auto;width:22px;bottom:.6em}
  .burger{display:grid}
}
/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative;min-height:min(100svh,940px);display:flex;align-items:center;
  padding:calc(var(--header-h) + clamp(40px,7vw,90px)) 0 clamp(50px,7vw,90px);
  overflow:hidden;
  background:
    radial-gradient(1100px 520px at 82% 8%,rgba(217,154,50,.16),transparent 62%),
    radial-gradient(760px 520px at 8% 92%,rgba(99,43,53,.14),transparent 65%),
    linear-gradient(180deg,var(--bg-alt),var(--bg) 70%);
}
.hero-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.hero .container{position:relative;z-index:2;display:grid;grid-template-columns:1.06fr .94fr;gap:clamp(32px,5vw,70px);align-items:center}
.hero-copy{max-width:640px}
.hero h1{
  font-size:clamp(2.6rem,6vw,4.6rem);line-height:1.04;margin:.42em 0 .32em;letter-spacing:-.02em;
}
.hero h1 .accent{font-family:var(--font-editorial);font-style:italic;font-weight:500;color:var(--maroon)}
[data-theme="dark"] .hero h1 .accent{color:var(--saffron)}
.hero-lead{font-size:clamp(1.02rem,1.5vw,1.17rem);color:var(--text-soft);max-width:56ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
.hero-note{
  margin-top:34px;padding-top:22px;border-top:1px solid var(--line);
  font-size:.9rem;color:var(--text-faint);max-width:58ch;display:flex;gap:12px;
}
.hero-note .ico{color:var(--gold);flex-shrink:0;margin-top:3px}
.hero-visual{position:relative}
.hero-frame{
  position:relative;border-radius:var(--radius-lg);overflow:hidden;
  border:1px solid rgba(185,154,88,.55);
  box-shadow:var(--shadow-lg);
  background:var(--surface);
  aspect-ratio:4/5;
  clip-path:inset(0 0 100% 0);
  animation:heroReveal 1.25s .35s var(--ease) forwards;
}
@keyframes heroReveal{to{clip-path:inset(0 0 0 0)}}
.hero-frame img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);animation:heroZoom 1.8s .5s var(--ease) forwards}
@keyframes heroZoom{to{transform:scale(1)}}
.hero-frame::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(200deg,rgba(99,43,53,.10),transparent 45%,rgba(36,35,31,.42));
}
.hero-caption{
  position:absolute;left:18px;right:18px;bottom:16px;z-index:2;color:#F6EEDD;
  font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;opacity:.92;
  text-shadow:0 2px 10px rgba(0,0,0,.6);
}
.hero-ornament{
  position:absolute;right:-34px;top:-34px;width:150px;height:150px;opacity:.5;
  animation:spinSlow 90s linear infinite;
}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.hero-badges{display:flex;gap:26px;margin-top:38px;flex-wrap:wrap}
.hero-badge strong{display:block;font-family:var(--font-serif);font-size:1.85rem;color:var(--maroon);line-height:1}
[data-theme="dark"] .hero-badge strong{color:var(--saffron)}
.hero-badge span{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}
.stagger>*{opacity:0;transform:translateY(24px);animation:fadeUp .9s var(--ease) forwards}
.stagger>*:nth-child(1){animation-delay:.15s}
.stagger>*:nth-child(2){animation-delay:.30s}
.stagger>*:nth-child(3){animation-delay:.45s}
.stagger>*:nth-child(4){animation-delay:.60s}
.stagger>*:nth-child(5){animation-delay:.75s}
.stagger>*:nth-child(6){animation-delay:.90s}
@keyframes fadeUp{to{opacity:1;transform:none}}

/* decorative page-motif band */
.motif-band{
  position:relative;overflow:hidden;padding:clamp(50px,7vw,88px) 0;
  background:
    linear-gradient(180deg,var(--bg-alt),var(--bg-alt)),
    radial-gradient(600px 300px at 50% 0,rgba(217,154,50,.12),transparent);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.motif-band::before{
  content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:radial-gradient(circle at 1px 1px,rgba(185,154,88,.35) 1px,transparent 0);
  background-size:34px 34px;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 40%,#000 60%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 40%,#000 60%,transparent);
}
/* ============================================================
   TIMELINE (defining feature of the site)
   ============================================================ */
.timeline-head{position:relative;z-index:2}
.timeline-controls{
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  margin:34px 0 14px;
}
.timeline-controls .grow{flex:1 1 280px;max-width:440px}
.timeline-progress{
  position:fixed;left:0;top:0;height:3px;width:100%;z-index:90;background:transparent;pointer-events:none;
}
.timeline-progress span{
  display:block;height:100%;width:0%;
  background:linear-gradient(90deg,var(--maroon),var(--saffron),var(--gold));
  box-shadow:0 0 12px rgba(217,154,50,.6);transition:width .12s linear;
}
.timeline-wrap{position:relative;margin-top:26px}
.timeline-track{position:relative;margin-top:26px;padding-top:6px}
.timeline-entries{position:relative}
.timeline-line{
  position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);
  background:var(--line);border-radius:2px;
}
.timeline-line::after{
  content:"";position:absolute;left:0;top:0;width:100%;height:var(--fill,0%);
  background:linear-gradient(180deg,var(--saffron),var(--gold));
  box-shadow:0 0 14px rgba(217,154,50,.7);transition:height .2s linear;
}
.timeline-entry{position:relative;width:50%;padding:0 54px 46px 0;text-align:right}
.timeline-entry:nth-child(even){margin-left:50%;padding:0 0 46px 54px;text-align:left}
.timeline-entry .marker{
  position:absolute;right:-13px;top:8px;width:26px;height:26px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line-strong);
  display:grid;place-items:center;transition:all .5s var(--ease);
}
.timeline-entry:nth-child(even) .marker{right:auto;left:-13px}
.timeline-entry .marker i{
  width:9px;height:9px;border-radius:50%;background:var(--line-strong);display:block;
  transition:all .5s var(--ease);
}
.timeline-entry.in .marker{border-color:var(--saffron);transform:scale(1.14);box-shadow:0 0 0 7px rgba(217,154,50,.14)}
.timeline-entry.in .marker i{background:var(--saffron);box-shadow:0 0 10px rgba(217,154,50,.9)}
.timeline-entry.active .marker{border-color:var(--maroon);background:var(--maroon);transform:scale(1.25)}
.timeline-entry.active .marker i{background:#fff}
.tl-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:24px 26px 22px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
  opacity:0;transform:translateX(46px);
  transition:opacity .75s var(--ease),transform .75s var(--ease),box-shadow .35s,border-color .35s;
  text-align:left;
}
.timeline-entry:nth-child(even) .tl-card{transform:translateX(-46px)}
.timeline-entry.in .tl-card{opacity:1;transform:none}
.tl-card:hover{box-shadow:var(--shadow-md);border-color:rgba(185,154,88,.65)}
.tl-card::before{
  content:"";position:absolute;inset:0 auto 0 0;width:3px;
  background:linear-gradient(180deg,var(--saffron),var(--maroon));opacity:.85;
}
.tl-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tl-date{
  font-family:var(--font-sans);font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--maroon);background:rgba(217,154,50,.14);border:1px solid rgba(217,154,50,.4);
  padding:.3em .8em;border-radius:999px;
}
[data-theme="dark"] .tl-date{color:var(--saffron)}
.tl-era{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)}
.tl-card h3{font-size:clamp(1.32rem,2vw,1.6rem);margin-bottom:.35em}
.tl-summary{font-size:.93rem;color:var(--text-soft);margin-bottom:.7em}
.tl-body{
  font-size:.92rem;color:var(--text-faint);overflow:hidden;
  max-height:0;opacity:0;
  transition:max-height .6s var(--ease),opacity .5s var(--ease),margin .5s;
}
.tl-card.open .tl-body{max-height:640px;opacity:1;margin-top:.4em}
.tl-figure{
  margin:0 0 16px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  clip-path:inset(0 0 100% 0);transition:clip-path 1s .18s var(--ease);background:var(--bg-alt);
}
.timeline-entry.in .tl-figure{clip-path:inset(0 0 0 0)}
.tl-figure img{width:100%;aspect-ratio:16/9;object-fit:cover;transition:transform .8s var(--ease)}
.tl-card:hover .tl-figure img{transform:scale(1.05)}
.tl-figure figcaption{font-size:.72rem;color:var(--text-faint);padding:8px 12px;letter-spacing:.03em;background:var(--surface-2)}
.tl-source{
  font-size:.75rem;color:var(--text-faint);letter-spacing:.04em;margin-top:14px;padding-top:12px;
  border-top:1px dashed var(--line);display:flex;gap:8px;align-items:flex-start;
}
.tl-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.tl-person{
  font-size:.8rem;color:var(--green);font-weight:600;letter-spacing:.05em;
}
[data-theme="dark"] .tl-person{color:#8FC5AA}
.accuracy-note{
  background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--gold);
  border-radius:0 14px 14px 0;padding:18px 22px;font-size:.9rem;color:var(--text-soft);
  display:flex;gap:14px;align-items:flex-start;margin-top:26px;
}
.accuracy-note .ico{color:var(--gold);flex-shrink:0;margin-top:2px}
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text-faint);
  border:1px dashed var(--line-strong);border-radius:var(--radius-lg);background:var(--surface-2);
}
.empty-state h3{font-size:1.5rem;margin-bottom:.4em;color:var(--text-soft)}

/* ============================================================
   CARD GRIDS (rulers / fighters / granths / blog)
   ============================================================ */
.page-hero{
  position:relative;padding:calc(var(--header-h) + clamp(50px,7vw,92px)) 0 clamp(46px,6vw,78px);
  overflow:hidden;background:
    radial-gradient(900px 420px at 88% 0,rgba(217,154,50,.18),transparent 65%),
    linear-gradient(180deg,var(--bg-alt),var(--bg));
  border-bottom:1px solid var(--line);
}
.page-hero .container{position:relative;z-index:2}
.page-hero h1{font-size:clamp(2.3rem,5vw,3.9rem);margin:.3em 0 .35em}
.page-hero .section-lead{max-width:70ch}
.page-hero-canvas{position:absolute;inset:0;pointer-events:none;opacity:.75}
.grid{display:grid;gap:clamp(18px,2.4vw,30px)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1080px){.grid.cols-4{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){.grid.cols-3,.grid.cols-4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .45s;
  box-shadow:var(--shadow-sm);
}
.card:hover{transform:translateY(-7px);box-shadow:var(--shadow-md);border-color:rgba(185,154,88,.7)}
.card-media{position:relative;overflow:hidden;background:var(--bg-alt);aspect-ratio:16/10}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.card:hover .card-media img{transform:scale(1.07)}
.card-media .tag{
  position:absolute;left:12px;top:12px;background:rgba(28,26,22,.72);color:#F6EEDD;
  font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:.4em .8em;border-radius:999px;
  backdrop-filter:blur(6px);
}
.card-body{padding:22px 22px 24px;display:flex;flex-direction:column;flex:1;gap:10px}
.card-body h3{font-size:1.42rem;line-height:1.2}
.card-kicker{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-3);font-weight:600}
.card-meta{display:flex;flex-wrap:wrap;gap:7px}
.meta-pill{
  font-size:.72rem;padding:.28em .7em;border-radius:6px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--text-soft);letter-spacing:.03em;
}
.card p{font-size:.9rem;color:var(--text-soft);margin:0}
.card .card-foot{margin-top:auto;padding-top:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.verify{
  display:inline-flex;align-items:center;gap:6px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;
  padding:.3em .7em;border-radius:999px;font-weight:600;border:1px solid;
}
.verify.ok{color:#22624A;border-color:rgba(49,90,72,.4);background:rgba(49,90,72,.1)}
.verify.limited{color:#8A5A15;border-color:rgba(217,154,50,.5);background:rgba(217,154,50,.13)}
.verify.assoc{color:#632B35;border-color:rgba(99,43,53,.35);background:rgba(99,43,53,.09)}
[data-theme="dark"] .verify.ok{color:#8FC5AA}
[data-theme="dark"] .verify.limited{color:#EDBB6C}
[data-theme="dark"] .verify.assoc{color:#E0A8B2}

/* granth cards — manuscript feel */
.granth-card{
  background:
    linear-gradient(180deg,var(--surface),var(--surface-2));
  position:relative;padding-top:0;
}
.granth-card .card-media{aspect-ratio:16/9;background:linear-gradient(140deg,#f3e7cf,#e8d6b4)}
[data-theme="dark"] .granth-card .card-media{background:linear-gradient(140deg,#2b261d,#34301f)}
.manthra{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--font-serif);font-size:2.6rem;color:rgba(99,43,53,.55);letter-spacing:.05em;
}
[data-theme="dark"] .manthra{color:rgba(226,190,120,.6)}
.granth-card .card-body{border-top:2px solid transparent}
.granth-card::after{
  content:"";position:absolute;left:22px;right:22px;top:0;height:2px;background:var(--gold-line);
}
.script-line{font-size:.8rem;color:var(--text-faint);font-style:italic}
.theme-tags{display:flex;flex-wrap:wrap;gap:6px}
.theme-tags span{font-size:.68rem;padding:.24em .6em;border-radius:5px;background:rgba(49,90,72,.09);border:1px solid rgba(49,90,72,.22);color:var(--green)}
[data-theme="dark"] .theme-tags span{background:rgba(143,197,170,.1);border-color:rgba(143,197,170,.3);color:#8FC5AA}

/* featured + blog */
.featured-article{
  display:grid;grid-template-columns:1.05fr .95fr;gap:0;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);margin-bottom:clamp(28px,4vw,46px);
}
.featured-article .fa-media{position:relative;min-height:320px;background:var(--bg-alt)}
.featured-article .fa-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.featured-article .fa-body{padding:clamp(26px,4vw,52px);display:flex;flex-direction:column;justify-content:center;gap:14px}
.featured-article h2{font-size:clamp(1.7rem,3vw,2.5rem)}
@media (max-width:860px){.featured-article{grid-template-columns:1fr}.featured-article .fa-media{min-height:220px}}
.badge-demo{
  display:inline-flex;align-items:center;gap:6px;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  background:rgba(99,43,53,.1);border:1px dashed rgba(99,43,53,.45);color:var(--maroon);
  padding:.34em .8em;border-radius:999px;font-weight:600;
}
[data-theme="dark"] .badge-demo{color:#E4A9B4;border-color:rgba(228,169,180,.4);background:rgba(228,169,180,.08)}
.cat-label{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-3);font-weight:700}
.byline{font-size:.78rem;color:var(--text-faint);display:flex;gap:14px;flex-wrap:wrap;letter-spacing:.03em}
.load-more-wrap{display:flex;justify-content:center;margin-top:38px}

/* article reading view */
.article-view{padding-top:calc(var(--header-h) + 34px)}
.article-hero{border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line);margin:22px 0 30px;background:var(--bg-alt)}
.article-hero img{width:100%;aspect-ratio:21/9;object-fit:cover}
.article-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:clamp(26px,4vw,56px);align-items:start}
.toc{position:sticky;top:calc(var(--header-h) + 24px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 22px}
.toc h4{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);font-family:var(--font-sans);margin-bottom:12px}
.toc a{display:block;font-size:.87rem;padding:7px 0 7px 14px;border-left:2px solid var(--line);color:var(--text-soft);transition:all .3s}
.toc a:hover,.toc a.active{color:var(--maroon);border-left-color:var(--saffron)}
[data-theme="dark"] .toc a:hover,[data-theme="dark"] .toc a.active{color:var(--saffron)}
.prose h2{font-size:clamp(1.5rem,2.4vw,2rem);margin:1.7em 0 .5em;scroll-margin-top:100px}
.prose p{font-size:1.03rem;color:var(--text-soft);line-height:1.85}
.prose blockquote{
  margin:1.6em 0;padding:16px 24px;border-left:3px solid var(--saffron);
  background:var(--surface-2);font-family:var(--font-serif);font-size:1.24rem;font-style:italic;color:var(--text);
  border-radius:0 12px 12px 0;
}
.sources-list{font-size:.86rem;color:var(--text-faint);padding-left:20px}
.sources-list li{margin-bottom:.5em}
.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:900px){.article-layout{grid-template-columns:1fr}.toc{position:static}.related-grid{grid-template-columns:1fr}}

/* ============================================================
   LINEAGE (Acharya Parampara)
   ============================================================ */
.lineage-shell{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:clamp(20px,3vw,40px);box-shadow:var(--shadow-sm);overflow-x:auto;
}
.lineage-branches{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:clamp(18px,3vw,38px);min-width:760px}
.lineage-branch h3{
  font-size:1.12rem;padding-bottom:12px;margin-bottom:16px;border-bottom:2px solid var(--line);
  display:flex;justify-content:space-between;gap:10px;align-items:baseline;
}
.lineage-branch h3 small{font-family:var(--font-sans);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}
.branch--modern h3{border-bottom-color:var(--saffron)}
.branch--digam h3{border-bottom-color:var(--maroon)}
.node-list{position:relative;padding-left:26px}
.node-list::before{
  content:"";position:absolute;left:8px;top:8px;bottom:14px;width:2px;background:var(--line);
  transform:scaleY(0);transform-origin:top;transition:transform .9s var(--ease);
}
.lineage-shell.in .node-list::before{transform:scaleY(1)}
.acharya-node{
  position:relative;margin-bottom:16px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:13px;padding:13px 16px;cursor:pointer;text-align:left;width:100%;
  transition:all .35s var(--ease);opacity:0;transform:translateY(16px);
}
.lineage-shell.in .acharya-node{opacity:1;transform:none}
.acharya-node::before{
  content:"";position:absolute;left:-24px;top:22px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:2px solid var(--gold);transition:all .3s var(--ease);
}
.acharya-node:hover,.acharya-node.selected{
  border-color:var(--saffron);box-shadow:var(--shadow-md);transform:translateX(5px);
}
.acharya-node:hover::before,.acharya-node.selected::before{background:var(--saffron);box-shadow:0 0 0 5px rgba(217,154,50,.2)}
.acharya-node strong{display:block;font-family:var(--font-serif);font-size:1.1rem}
.acharya-node span{font-size:.76rem;color:var(--text-faint);letter-spacing:.05em}
.acharya-node .node-branch-link{
  font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-3);display:block;margin-top:4px;
}
.lineage-detail{
  margin-top:26px;border-top:1px dashed var(--line);padding-top:24px;
  display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;
}
.lineage-detail .seal{
  width:78px;height:78px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(217,154,50,.22),rgba(99,43,53,.14));
  border:1px solid rgba(185,154,88,.6);font-family:var(--font-serif);font-size:1.7rem;color:var(--maroon);
}
[data-theme="dark"] .lineage-detail .seal{color:var(--saffron)}
@media (max-width:720px){.lineage-detail{grid-template-columns:1fr}}
/* hard scroll lock while a modal / admin dialog is open */
html.modal-open{overflow:hidden;overscroll-behavior:none}
.modal-overlay,.modal-panel,.search-panel,.admin-overlay,.admin-panel{overscroll-behavior:contain}

/* ============================================================
   MODALS & SEARCH
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  padding:clamp(12px,3vw,40px);background:rgba(24,22,18,.62);backdrop-filter:blur(7px);
  animation:fadeIn .3s var(--ease) both;overflow-y:auto;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-panel{
  position:relative;background:var(--bg);border:1px solid rgba(185,154,88,.5);
  border-radius:var(--radius-lg);width:min(880px,100%);max-height:calc(100svh - 40px);
  overflow-y:auto;box-shadow:var(--shadow-lg);
  animation:modalIn .45s var(--ease) both;
}
@keyframes modalIn{from{opacity:0;transform:translateY(30px) scale(.98)}to{opacity:1;transform:none}}
.modal-top{
  position:sticky;top:0;z-index:3;display:flex;gap:14px;align-items:flex-start;justify-content:space-between;
  padding:24px clamp(20px,4vw,40px) 0;
  background:linear-gradient(180deg,var(--bg) 70%,transparent);
}
.modal-panel .modal-media{margin:18px clamp(20px,4vw,40px) 0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--bg-alt)}
.modal-panel .modal-media img{width:100%;aspect-ratio:16/8;object-fit:cover}
.modal-content{padding:22px clamp(20px,4vw,40px) 30px}
.modal-content h2{font-size:clamp(1.7rem,3.4vw,2.5rem);margin-bottom:.2em}
.modal-sub{font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);font-weight:600;margin-bottom:14px}
.modal-content p{color:var(--text-soft);font-size:.99rem}
.facts{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:22px 0;
}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.fact dt{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);margin-bottom:5px}
.fact dd{margin:0;font-size:.92rem;font-weight:500;color:var(--text)}
.modal-close{
  position:sticky;top:0;flex-shrink:0;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;
  transition:all .3s var(--ease);z-index:4;
}
.modal-close:hover{background:var(--maroon);color:#fff;transform:rotate(90deg)}
.modal-nav{
  display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--line);
  padding:16px clamp(20px,4vw,40px);position:sticky;bottom:0;background:var(--bg);
}
.modal-nav .btn{max-width:48%}

.search-panel{
  width:min(760px,100%);background:var(--bg);border:1px solid rgba(185,154,88,.55);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow:hidden;
  animation:modalIn .4s var(--ease) both;align-self:flex-start;margin-top:8vh;
}
.search-head{padding:22px 24px 8px;display:flex;gap:12px;align-items:center}
.search-head .field{flex:1}
.search-head .field input{font-size:1.05rem;padding:.35em 0}
.search-results{max-height:min(58vh,520px);overflow-y:auto;padding:8px 14px 20px}
.result-group h4{
  font-family:var(--font-sans);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--text-faint);margin:16px 10px 8px;
}
.result-item{
  display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:11px 12px;
  border-radius:12px;border:1px solid transparent;background:transparent;cursor:pointer;
  transition:all .25s var(--ease);
}
.result-item:hover,.result-item:focus-visible{background:var(--surface);border-color:var(--line);transform:translateX(4px)}
.result-item .ico{color:var(--gold);flex-shrink:0;margin-top:3px}
.result-item strong{display:block;font-size:.95rem;font-weight:600}
.result-item span{font-size:.8rem;color:var(--text-faint)}
mark{background:rgba(217,154,50,.35);color:inherit;border-radius:3px;padding:0 2px}
.search-hint{padding:14px 26px 22px;font-size:.78rem;color:var(--text-faint);border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap}
kbd{
  font-family:var(--font-sans);font-size:.7rem;border:1px solid var(--line-strong);border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;background:var(--surface);
}

/* ============================================================
   FOOTER
   ============================================================ */
.site-footer{
  background:linear-gradient(180deg,var(--bg-alt),var(--bg-alt));
  border-top:1px solid var(--line);position:relative;overflow:hidden;padding-top:0;
}
.footer-motif{height:26px;width:100%;background:repeating-linear-gradient(90deg,
  transparent 0 26px,rgba(185,154,88,.55) 26px 28px);opacity:.5;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);
}
.footer-grid{
  display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:clamp(24px,4vw,50px);
  padding:clamp(40px,6vw,72px) 0 34px;
}
@media (max-width:980px){.footer-grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.footer-grid{grid-template-columns:1fr}}
.footer-grid h4{font-family:var(--font-sans);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.footer-grid ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.footer-grid li a,.footer-link{font-size:.89rem;color:var(--text-soft);transition:all .3s;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.footer-grid li a:hover,.footer-link:hover{color:var(--maroon);transform:translateX(4px)}
[data-theme="dark"] .footer-grid li a:hover,[data-theme="dark"] .footer-link:hover{color:var(--saffron)}
.footer-about p{font-size:.9rem;color:var(--text-soft);margin-top:14px;max-width:38ch}
.social-row{display:flex;gap:10px;margin-top:18px}
.social-row a{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;
  color:var(--text-soft);transition:all .3s var(--ease);
}
.social-row a:hover{background:var(--maroon);border-color:var(--maroon);color:#fff;transform:translateY(-3px)}
.footer-bottom{
  border-top:1px solid var(--line);padding:20px 0 34px;display:flex;justify-content:space-between;
  gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--text-faint);
}
.footer-bottom .links{display:flex;gap:20px;flex-wrap:wrap}

/* ============================================================
   CANVAS / MISC UTILITIES
   ============================================================ */
.heritage-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.float-glyph{position:absolute;font-family:var(--font-serif);color:var(--gold);opacity:.16;pointer-events:none;user-select:none}
.section-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(217,154,50,.14);border:1px solid rgba(185,154,88,.45);color:var(--maroon)}
[data-theme="dark"] .section-icon{color:var(--saffron)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,70px);align-items:center}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.feature-list{display:grid;gap:18px}
.feature-item{display:flex;gap:16px;align-items:flex-start}
.feature-item h4{font-size:1.15rem;margin-bottom:.25em}
.feature-item p{font-size:.9rem;color:var(--text-soft);margin:0}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stat{background:var(--surface);padding:22px 18px;text-align:center}
.stat strong{display:block;font-family:var(--font-serif);font-size:2rem;color:var(--maroon)}
[data-theme="dark"] .stat strong{color:var(--saffron)}
.stat span{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}
.img-fallback{
  width:100%;height:100%;min-height:120px;display:grid;place-items:center;gap:6px;
  background:
    radial-gradient(circle at 30% 25%,rgba(217,154,50,.35),transparent 55%),
    linear-gradient(145deg,#efe2c7,#e5d2ae);
  color:#632B35;text-align:center;padding:16px;
}
[data-theme="dark"] .img-fallback{background:radial-gradient(circle at 30% 25%,rgba(217,154,50,.28),transparent 55%),linear-gradient(145deg,#2a2519,#231f16);color:#E2BE78}
.img-fallback small{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:140;
  background:var(--ink);color:#F6EEDD;padding:12px 22px;border-radius:999px;font-size:.85rem;
  box-shadow:var(--shadow-lg);animation:toastIn .4s var(--ease) both;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
.page-enter{animation:pageEnter .55s var(--ease) backwards}
/* fill-mode 'both' would hold the animation's end state as a computed
   identity matrix — which makes .page-enter a containing block for every
   position:fixed child (modals/search/admin) and renders them off-screen;
   'backwards' plays the same entrance then reverts transform to none */
@keyframes pageEnter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.section-nav{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
.back-link{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--text-soft);transition:all .3s}
.back-link:hover{color:var(--maroon);transform:translateX(-4px)}
[data-theme="dark"] .back-link:hover{color:var(--saffron)}
.check-list{list-style:none;padding:0;margin:0;display:grid;gap:11px}
.check-list li{display:flex;gap:11px;font-size:.92rem;color:var(--text-soft);align-items:flex-start}
.check-list .ico{color:var(--green);flex-shrink:0;margin-top:4px}
[data-theme="dark"] .check-list .ico{color:#8FC5AA}

/* ============================================================
   RESPONSIVE FINE-TUNING
   ============================================================ */
@media (max-width:1080px){
  .hero .container{grid-template-columns:1fr;gap:44px}
  .hero-copy{max-width:none}
  .hero-frame{aspect-ratio:16/11;max-width:660px}
}
@media (max-width:760px){
  body{font-size:16px}
  .brand-tag{display:none}
  .hero{min-height:auto}
  .hero-ornament{display:none}
  .hero-badges{gap:18px}
  .timeline-line{left:14px}
  .timeline-entry,.timeline-entry:nth-child(even){
    width:100%;margin-left:0;padding:0 0 40px 46px;text-align:left;
  }
  .timeline-entry .marker,.timeline-entry:nth-child(even) .marker{left:1px;right:auto}
  .tl-card,.timeline-entry:nth-child(even) .tl-card{transform:translateY(34px)}
  .timeline-entry.in .tl-card{transform:none}
  .toolbar{flex-direction:column;align-items:stretch}
  .toolbar .grow{max-width:none}
  .chip-row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .lineage-branches{grid-template-columns:1fr;min-width:0}
  .lineage-shell{overflow-x:visible}
  .facts{grid-template-columns:1fr 1fr}
  .modal-overlay{padding:0;align-items:flex-end}
  .modal-panel{max-height:94svh;border-radius:22px 22px 0 0;width:100%}
  .search-panel{margin-top:0;border-radius:22px 22px 0 0;align-self:flex-end}
  .modal-nav .btn{font-size:.78rem;padding:.7em 1em}
  .hero-actions .btn{flex:1 1 100%}
}
@media (max-width:400px){
  .section-title{font-size:1.9rem}
  .facts{grid-template-columns:1fr}
}

/* ============================================================
   MOBILE REFINEMENTS (≤760px)
   compact search fields, side-by-side filter selects, denser
   cards and tighter rhythm — nothing overflows at 360px
   ============================================================ */
@media (max-width:760px){
  :root{--header-h:62px}
  .section{padding:52px 0}
  .section.tight{padding:36px 0}
  .page-hero{padding-top:calc(var(--header-h) + 38px);padding-bottom:36px}

  /* --- search fields & toolbars: compact --- */
  .toolbar{flex-direction:row;flex-wrap:wrap;gap:10px;align-items:stretch}
  .toolbar .grow{flex:1 1 100%;max-width:none}
  .toolbar .select-wrap{flex:1 1 calc(50% - 5px);min-width:0;overflow:hidden}
  .toolbar > .btn{flex:1 1 100%}
  .field{padding:.45em .85em;gap:8px}
  .field input{font-size:.86rem}
  .field select{font-size:.86rem;width:100%;flex:1;min-width:0;max-width:100%}
  .select-wrap::after{right:8px}
  .chip{font-size:.78rem;padding:.45em .85em}
  .count-note{font-size:.76rem}
  .timeline-controls{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px;align-items:stretch}
  .timeline-controls .grow{max-width:none;width:100%;min-width:0;flex:none}
  .timeline-controls .field{width:100%;min-width:0}
  .timeline-controls .btn{width:100%}
  .timeline-controls .chip-row{max-width:100%;min-width:0;width:100%}

  /* --- search modal --- */
  .search-head{padding:16px 12px 4px;gap:8px}
  .search-head .field input{font-size:.95rem}
  .search-results{max-height:56vh;padding:4px 8px 14px}
  .result-item{padding:10px}
  .result-item strong{font-size:.9rem}
  .search-hint{padding:10px 14px 16px;gap:10px;font-size:.7rem}

  /* --- timeline --- */
  .timeline-wrap{margin-top:18px}
  .timeline-track{margin-top:18px;padding-top:4px}
  .timeline-line{left:16px}
  .timeline-entry,.timeline-entry:nth-child(even){padding:0 0 34px 48px}
  .timeline-entry .marker,.timeline-entry:nth-child(even) .marker{left:4px;right:auto}
  .tl-card{padding:18px 16px 16px;border-radius:16px}
  .tl-card h3{font-size:1.24rem}
  .tl-summary{font-size:.88rem}
  .tl-body{font-size:.87rem}
  .tl-figure figcaption{font-size:.68rem;padding:7px 10px}
  .tl-actions{gap:8px}
  .tl-actions .btn{padding:.5em .95em;font-size:.8rem}
  .tl-source{font-size:.72rem}

  /* --- cards & editorial blocks --- */
  .card-body{padding:18px 16px 20px;gap:8px}
  .card-body h3{font-size:1.24rem}
  .card-media{aspect-ratio:16/9}
  .featured-article .fa-body{padding:22px 18px;gap:10px}
  .featured-article h2{font-size:1.45rem}
  .featured-article .fa-media{min-height:190px}
  .prose p{font-size:1rem;line-height:1.8}
  .prose h2{font-size:1.38rem}
  .article-view{padding-top:calc(var(--header-h) + 22px)}
  .article-hero img{aspect-ratio:16/9}
  .lineage-shell{padding:16px 14px}
  .acharya-node{padding:11px 13px}

  /* --- hero, modals, footer --- */
  .hero{padding-top:calc(var(--header-h) + 30px);padding-bottom:44px}
  .hero h1{font-size:clamp(2.05rem,8.6vw,2.7rem)}
  .hero-lead{font-size:1rem}
  .hero-note{font-size:.83rem;margin-top:24px;padding-top:16px}
  .hero-badges{gap:14px;margin-top:28px}
  .hero-badge strong{font-size:1.5rem}
  .hero-frame{aspect-ratio:4/3}
  .stat{padding:16px 10px}
  .stat strong{font-size:1.42rem}
  .modal-top{padding:16px 16px 0}
  .modal-panel .modal-media{margin:12px 16px 0}
  .modal-content{padding:18px 16px 26px}
  .modal-content h2{font-size:1.5rem}
  .modal-nav{padding:12px 14px}
  .footer-bottom{font-size:.74rem;padding-bottom:26px}
  .footer-grid{padding-top:34px}
}

/* ============================================================
   NEW SECTIONS — hero tagline, section tiles,
   India map (Jinlayas) and temple list
   ============================================================ */
.hero-tagline{
  font-family:var(--font-editorial);font-style:italic;font-size:1.06rem;
  color:var(--gold);letter-spacing:.03em;margin:0 0 .35em;
}
.section-tiles .tile-card{height:100%}
.tile-card .card-body{gap:8px}
.tile-card .section-icon{margin-bottom:4px}
.tile-card:hover .btn.ghost{color:var(--maroon)}
[data-theme="dark"] .tile-card:hover .btn.ghost{color:var(--saffron)}
.nav-link{padding:.5em .62em;font-size:.85rem}

/* --- India map (Jinlayas page) --- */
.map-layout{
  display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(24px,4vw,46px);
  align-items:start;margin-top:34px;
}
@media (max-width:900px){.map-layout{grid-template-columns:1fr}}
.map-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:clamp(16px,2.5vw,28px);box-shadow:var(--shadow-sm);
}
.map-head{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.india-map-wrap{position:relative}
.india-map{width:100%;height:auto;display:block}
.india-map path.state{
  fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1;stroke-linejoin:round;
  transition:fill .25s var(--ease),stroke .25s var(--ease);
}
.india-map path.state.has-temples{
  fill:rgba(217,154,50,.20);stroke:rgba(185,154,88,.75);cursor:pointer;
}
.india-map path.state.has-temples:hover,
.india-map path.state.has-temples:focus-visible{fill:rgba(217,154,50,.44);outline:none}
.india-map path.state.selected{fill:var(--maroon);stroke:var(--maroon)}
[data-theme="dark"] .india-map path.state{fill:#26241D;stroke:rgba(239,232,217,.32)}
[data-theme="dark"] .india-map path.state.has-temples{fill:rgba(217,154,50,.18);stroke:rgba(215,178,100,.6)}
[data-theme="dark"] .india-map path.state.has-temples:hover,
[data-theme="dark"] .india-map path.state.has-temples:focus-visible{fill:rgba(217,154,50,.4)}
[data-theme="dark"] .india-map path.state.selected{fill:var(--saffron);stroke:var(--saffron)}
.map-side{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:clamp(18px,2.5vw,28px);box-shadow:var(--shadow-sm);min-height:260px;
}
.temple-list{display:grid;gap:10px}
.temple-item{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;
  padding:13px 16px;cursor:pointer;transition:all .3s var(--ease);
}
.temple-item:hover{border-color:var(--saffron);transform:translateX(4px);box-shadow:var(--shadow-sm)}
.temple-item-main strong{display:block;font-family:var(--font-serif);font-size:1.08rem}
.temple-item-main span{font-size:.78rem;color:var(--text-faint);letter-spacing:.03em}
@media (max-width:600px){
  .temple-item{padding:11px 13px}
  .temple-item-main strong{font-size:1rem}
}

/* ============================================================
   MOBILE OVERFLOW REPAIRS (verified at 360–412px)
   ============================================================ */
/* 1. India map panel (Jinlayas): grid children default to min-width:auto,
      so the nowrap chip row forced the panel — and the map SVG — to ~1100px
      (clipped on phones). Let the children shrink instead. */
@media (max-width:900px){
  .map-layout>*{min-width:0}
  .india-map{max-width:100%}
}
/* 2. Header must fit small phones: brand + 3 icon buttons were 371px wide
      inside a 338px container at 360px, pushing the buttons off-screen. */
@media (max-width:430px){
  .site-header .container{gap:10px}
  .brand{flex:1 1 auto;min-width:0;gap:9px}
  .brand-mark{width:34px;height:34px;border-radius:10px}
  .brand-name{font-size:1.06rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .header-actions{gap:3px}
  .icon-btn{width:35px;height:35px;border-radius:10px}
}
/* 3. Page-hero canvas: without an explicit size the canvas keeps its
      600px attribute width and gets cropped on phones. */
.page-hero-canvas{width:100%;height:100%}

/* ============================================================
   LANGUAGE TOGGLE (header, top-right)
   ============================================================ */
.lang-btn{
  min-width:42px;height:32px;padding:0 11px;border-radius:999px;
  border:1px solid rgba(185,154,88,.55);background:rgba(185,154,88,.12);
  color:var(--maroon);font-weight:700;font-size:.8rem;letter-spacing:.05em;
  cursor:pointer;transition:all .3s var(--ease);display:grid;place-items:center;
  font-family:var(--font-sans);flex-shrink:0;
}
.lang-btn:hover{background:rgba(185,154,88,.26);transform:translateY(-1px);border-color:var(--gold)}
[data-theme="dark"] .lang-btn{color:var(--saffron);border-color:rgba(215,178,100,.5);background:rgba(215,178,100,.1)}
@media (max-width:430px){.lang-btn{min-width:36px;height:30px;font-size:.72rem;padding:0 8px}}

/* accessibility: reduced motion */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important;
  }
  .reveal{opacity:1 !important;transform:none !important}
  .tl-card{opacity:1 !important;transform:none !important}
  .tl-figure{clip-path:none !important}
  .hero-frame{clip-path:none !important}
  .stagger>*{opacity:1 !important;transform:none !important}
  .acharya-node{opacity:1 !important;transform:none !important}
}
/* ---------- admin panel (12 logo clicks) ---------- */
.admin-mount{position:fixed;inset:0;z-index:2000}
.admin-overlay{position:absolute;inset:0;background:rgba(12,10,7,.6);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px}
.admin-panel{width:100%;max-width:1120px;height:min(94vh,880px);background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.adm-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.adm-head h2{font-size:1.02rem;margin:0;flex:1;font-family:var(--font-serif,serif)}
.adm-head .adm-sub{font-size:.72rem;color:var(--text-faint);display:block;letter-spacing:.05em}
.adm-body{flex:1;display:flex;min-height:0}
.adm-side{width:236px;border-right:1px solid var(--line);overflow-y:auto;padding:10px;background:var(--surface-2)}
.adm-side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text-soft);padding:9px 12px;border-radius:9px;font-size:.86rem;cursor:pointer;font-family:var(--font-sans)}
.adm-side button:hover{background:var(--surface);color:var(--text)}
.adm-side button.on{background:var(--saffron);color:#fff;font-weight:600}
.adm-side .adm-count{float:right;opacity:.65;font-size:.74rem}
.adm-main{flex:1;overflow-y:auto;padding:16px 20px 30px}
.adm-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.adm-toolbar input[type=search]{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.5em 1em;color:var(--text);font-size:.86rem;font-family:var(--font-sans)}
.adm-entry{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px;overflow:hidden}
.adm-entry-head{display:flex;gap:8px;align-items:center;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:.85rem}
.adm-entry-head .adm-idx{color:var(--text-faint);font-size:.74rem;min-width:34px}
.adm-entry-head strong{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-entry-body{padding:12px}
.adm-field{display:block;margin-bottom:10px}
.adm-field>span{display:block;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px}
.adm-field input,.adm-field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:.5em .7em;font-size:.88rem;font-family:var(--font-sans)}
.adm-field input:focus,.adm-field textarea:focus{outline:none;border-color:var(--saffron)}
textarea.adm-json{font-family:ui-monospace,Consolas,monospace;font-size:.76rem}
.adm-imgprev{max-width:130px;max-height:86px;border-radius:8px;margin-top:6px;object-fit:cover;border:1px solid var(--line)}
.adm-err{color:#c0392b;font-size:.76rem;display:block;margin-top:3px}
.adm-mini{border:1px solid var(--line);background:var(--bg);color:var(--text-soft);border-radius:8px;min-width:28px;height:28px;cursor:pointer;font-size:.8rem;padding:0 6px}
.adm-mini:hover{border-color:var(--saffron);color:var(--text)}
.adm-foot{display:flex;gap:10px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.adm-status{font-size:.82rem;color:var(--text-soft);flex:1;min-width:160px}
.adm-empty{padding:34px;text-align:center;color:var(--text-faint);border:1px dashed var(--line);border-radius:12px}
@media (max-width:760px){.adm-side{width:136px}.adm-side button{font-size:.76rem;padding:8px}.adm-field>span{font-size:.64rem}}
.adm-head .adm-dirty{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:#B5461F;background:rgba(217,105,44,.12);border:1px solid rgba(217,105,44,.4);padding:.25em .7em;border-radius:999px;margin-left:8px;vertical-align:middle}
.adm-qedit{min-width:120px;flex:1;font:inherit;font-weight:600;font-size:.92rem;border:1px solid transparent;background:transparent;color:var(--text);border-radius:8px;padding:4px 8px}
.adm-qedit:hover{border-color:var(--line);background:var(--surface)}
.adm-qedit:focus{outline:none;border-color:var(--saffron);background:var(--bg)}
.adm-addrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.adm-addrow input{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:7px 10px;font-size:.85rem;font-family:var(--font-sans)}
.adm-addrow input.adm-key{flex:0 1 200px;min-width:0}
.adm-addrow input.adm-val{flex:1 1 240px;min-width:0}
.adm-link{font-size:.74rem;color:var(--accent-3);text-decoration:underline;display:inline-block;margin-top:6px}
.adm-foot .btn{white-space:nowrap}
/* ---------- Cloudinary PDF upload (admin) ---------- */
.adm-pdfupload{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-2px 0 12px}
.adm-pdfupload .btn{white-space:nowrap}
.adm-pdfupload small{font-size:.74rem;color:var(--text-faint);letter-spacing:.02em}
.adm-pdfupload small.adm-err{color:#c0392b}

/* ---------- admin password gate ---------- */
.adm-gate{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:30px 32px;width:min(380px,92vw);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.adm-gate h2{font-family:var(--font-serif,serif);margin:0 0 6px;font-size:1.15rem;color:var(--text)}
.adm-gate p{color:var(--text-soft);font-size:.86rem;margin:0 0 16px}
.adm-gate input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.7em 1em;color:var(--text);font-size:.95rem;letter-spacing:.1em;font-family:var(--font-sans)}
.adm-gate input:focus{outline:none;border-color:var(--saffron)}
.adm-gate-actions{display:flex;gap:10px;justify-content:center;margin-top:14px}
.adm-gate .adm-err{color:#c0392b;font-size:.8rem;margin-top:10px}
</style>
</head>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    summary: "Rock-cut Jain cells with painted lotus ceilings — the finest surviving early Jain paintings in South India.",
    body: "Sittannavasal is a low hill of rock-cut Jain cells, inscriptions and carved beds used by Jain ascetics, with a small tank nearby. Its chapel ceiling carries frescoes — lotus blooms, fish, and figures of monks and donors — dating broadly to the early medieval period and related in style to the paintings of Ajanta. Tamil and Prakrit inscriptions found here record the gifts of local donors, documenting a strong Jain presence in the Pandya country.",

    summary: "A hill of Jain beds, inscriptions and carved tirthankara images above Madurai.",
    body: "The rocky hill on the outskirts of Madurai — known as Samanar Malai — carries rock-cut beds, Tamil Brahmi and later Tamil inscriptions, and carved figures of Tirthankaras and the deity Mahavira, left by Jain ascetic communities who lived here over many centuries. It is one of the best-documented evidence sites for the once-large Tamil Jain presence around Madurai.",

    facts: [ {k:"Location",v:"Madurai, Tamil Nadu"}, {k:"Tradition",v:"Digambara"}, {k:"Evidence",v:"Jain beds · inscriptions · sculpture"} ],

  {

    summary: "A thousand-year-old temple town whose Jain images span many centuries.",
    body: "Kolanupaka, an old town on the road between Hyderabad and Warangal, holds a Jain temple with images of the Tirthankaras dating across several centuries, including a highly venerated Rishabhanatha image. The town's Jain remains — stone images, inscriptions and the temple itself — document the strong Jain presence in the Deccan between the early medieval and Vijayanagara periods.",

const IMAGE_CACHE = new Map();      /* title -> Promise<url|null> */
const IMAGE_WAITING = new Map();    /* title -> resolve (queued) */
const IMAGE_INFLIGHT = new Map();   /* title -> resolve (requested) */
let imageFlushTimer = 0;

function settleTitle(title, src) {
  const resolve = IMAGE_INFLIGHT.get(title);
  if (resolve) { IMAGE_INFLIGHT.delete(title); resolve(src); }
}
function scheduleImageFlush() {
  if (!imageFlushTimer && IMAGE_WAITING.size) imageFlushTimer = setTimeout(flushImageBatch, 250);
}
function flushImageBatch() {
  imageFlushTimer = 0;
  if (!IMAGE_WAITING.size) return;
  const titles = Array.from(IMAGE_WAITING.keys()).slice(0, 40);
  titles.forEach((t) => { IMAGE_INFLIGHT.set(t, IMAGE_WAITING.get(t)); IMAGE_WAITING.delete(t); });
  const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1" +
    "&prop=pageimages&piprop=thumbnail&pithumbsize=1200&titles=" + encodeURIComponent(titles.join("|"));
  fetch(url)
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => {
      const norm = (s) => String(s || "").replace(/_/g, " ").toLowerCase();
      const byKey = new Map();
      const alias = new Map();
      const q = (data && data.query) || {};
      /* follow normalization + redirect hops (e.g. "Kumarpala" -> "Kumarapala (Chaulukya dynasty)") */
      (q.normalized || []).forEach((n) => alias.set(norm(n.from), norm(n.to)));
      (q.redirects || []).forEach((n) => alias.set(norm(n.from), norm(n.to)));
      const finalKey = (k) => { let cur = k; for (let i = 0; i < 4 && alias.has(cur); i++) cur = alias.get(cur); return cur; };
      const pages = q.pages || {};
      Object.keys(pages).forEach((id) => {
        const pg = pages[id];
        if (!pg) return;
        const key = norm(pg.title);
        if (pg.missing !== undefined) byKey.set(key, null);
        else byKey.set(key, pg.thumbnail ? pg.thumbnail.source : null);
      });
      titles.forEach((t) => {
        const key = finalKey(norm(t));
        settleTitle(t, byKey.has(key) ? byKey.get(key) : null);
      });
      scheduleImageFlush();
    })
    .catch(() => {
      titles.forEach((t) => settleTitle(t, null));
      scheduleImageFlush();
    });
}
function fetchImageSource(title) {
  /* Digambara override wins over the Wikipedia lead image */
  const forced = DIGAMBARA_IMAGES[title];
  if (forced) return Promise.resolve(forced);
  if (IMAGE_CACHE.has(title)) return IMAGE_CACHE.get(title);
  const p = new Promise((resolve) => {
    IMAGE_WAITING.set(title, resolve);
    scheduleImageFlush();
  });
  IMAGE_CACHE.set(title, p);
  return p;
}

function HeritageImage({ title, img, alt, className = "", caption, eager = false }) {
  const direct = (typeof img === "string" && /^https?:\/\//i.test(img.trim())) ? img.trim()
    : ((typeof title === "string" && /^https?:\/\//i.test(title.trim())) ? title.trim() : null);
  const lookup = direct ? null : title;
  const [src, setSrc] = useState(direct);
  const [failed, setFailed] = useState(!title && !direct);
  useEffect(() => {
    if (direct) { setSrc(direct); setFailed(false); return undefined; }
    if (!lookup) return undefined;
    let alive = true;
    fetchImageSource(lookup).then((u) => {
      if (!alive) return;
      if (u) setSrc(u); else setFailed(true);
    });
    return () => { alive = false; };
  }, [direct, lookup]);

  if (failed || !src) {
    return (
      <div className={"img-fallback " + className} role="img" aria-label={alt || title || "Decorative heritage motif"}>
        <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
          <circle cx="36" cy="36" r="26" fill="none" stroke="currentColor" strokeWidth="1" opacity=".55"/>
          <circle cx="36" cy="36" r="17" fill="none" stroke="currentColor" strokeWidth="1" opacity=".45"/>
          {[0,45,90,135,180,225,270,315].map((a) => (
            <path key={a} d="M36 10c4 7 6 12 6 16s-2 9-6 12c-4-3-6-7-6-12s2-9 6-16z"
              fill="currentColor" opacity=".35" transform={"rotate(" + a + " 36 36)"}/>
          ))}
        </svg>
        <small>{failed ? t("Decorative motif") : t("Loading image")}</small>
        {caption ? <small style={{opacity:.7}}>{caption}</small> : null}
      </div>
    );
  }
  return (
    <img src={src} alt={alt || title} className={className} loading={eager ? "eager" : "lazy"}
      decoding="async" onError={() => setFailed(true)} />
  );
}

/*
   HeritageCanvas — subtle golden dust + slow mandala rings.
   · devicePixelRatio aware, debounced resize
   · pauses when the tab is hidden
   · static single frame under prefers-reduced-motion
   · never intercepts pointer/scroll events
*/
function HeritageCanvas({ density = 1, className = "hero-canvas" }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return undefined;
    const ctx = canvas.getContext("2d");
    if (!ctx) return undefined;
    const reduced = prefersReducedMotion();
    let raf = 0, w = 0, h = 0, dpr = 1, particles = [], rings = [], running = true;
    let pointer = { x: 0.5, y: 0.5 }, target = { x: 0.5, y: 0.5 };

    const build = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      w = Math.max(1, Math.floor(rect.width)); h = Math.max(1, Math.floor(rect.height));
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const mobile = w < 760;
      const count = Math.round((mobile ? 26 : 54) * density);
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        r: 0.7 + Math.random() * 1.9, a: 0.12 + Math.random() * 0.38,
        vx: (Math.random() - 0.5) * 0.14, vy: -0.05 - Math.random() * 0.16,
        p: Math.random() * Math.PI * 2, depth: 0.4 + Math.random() * 0.9
      }));
      rings = Array.from({ length: mobile ? 2 : 3 }, (_, i) => ({
        x: w * (0.18 + i * 0.34), y: h * (0.24 + (i % 2) * 0.5),
        r: (mobile ? 90 : 150) + i * 60, rot: Math.random() * Math.PI,
        vr: (i % 2 ? -1 : 1) * 0.00016
      }));
    };

    const drawRings = () => {
      rings.forEach((ring) => {
        ctx.save();
        ctx.translate(ring.x + (pointer.x - 0.5) * 26, ring.y + (pointer.y - 0.5) * 20);
        ctx.rotate(ring.rot);
        ctx.strokeStyle = "rgba(185,154,88,0.20)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, 0, ring.r, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = "rgba(185,154,88,0.13)";
        for (let k = 0; k < 12; k++) {
          const a = (k / 12) * Math.PI * 2;
          ctx.beginPath();
          ctx.ellipse(0, 0, ring.r * 0.62, ring.r * 0.24, a, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      });
    };
    const drawParticles = () => {
      particles.forEach((p) => {
        const x = p.x + (pointer.x - 0.5) * 30 * p.depth;
        const y = p.y + (pointer.y - 0.5) * 22 * p.depth;
        const twinkle = 0.72 + 0.28 * Math.sin(p.p);
        ctx.beginPath();
        ctx.fillStyle = "rgba(217,154,50," + (p.a * twinkle).toFixed(3) + ")";
        ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.fill();
      });
    };
    const frame = () => {
      if (!running) return;
      ctx.clearRect(0, 0, w, h);
      pointer.x += (target.x - pointer.x) * 0.04;
      pointer.y += (target.y - pointer.y) * 0.04;
      rings.forEach((r) => { r.rot += r.vr * 16; });
      particles.forEach((p) => {
        p.x += p.vx; p.y += p.vy; p.p += 0.018;
        if (p.y < -8) { p.y = h + 6; p.x = Math.random() * w; }
        if (p.x < -8) p.x = w + 6;
        if (p.x > w + 8) p.x = -6;
      });
      drawRings(); drawParticles();
      raf = window.requestAnimationFrame(frame);
    };
    const start = () => { if (!running) { running = true; if (!reduced) raf = requestAnimationFrame(frame); } };
    const stop = () => { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; };
    const onMove = (e) => { target.x = e.clientX / window.innerWidth; target.y = e.clientY / window.innerHeight; };
    let resizeTimer = 0;
    const onResize = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { build(); if (reduced) { ctx.clearRect(0,0,w,h); drawRings(); drawParticles(); } }, 180); };

    build();
    if (reduced) { drawRings(); drawParticles(); }
    else raf = requestAnimationFrame(frame);
    const onVis = () => (document.hidden ? stop() : start());
    window.addEventListener("resize", onResize);
    window.addEventListener("pointermove", onMove, { passive: true });
    document.addEventListener("visibilitychange", onVis);
    return () => {
      stop();
      window.removeEventListener("resize", onResize);
      window.removeEventListener("pointermove", onMove);
      document.removeEventListener("visibilitychange", onVis);
    };
  }, [density]);
  return <canvas ref={canvasRef} className={className} aria-hidden="true" />;
}

function Header({ route, onSearch, theme, toggleTheme, toggleLang }) {
  const lang = useLang();
  const site = useSite();
  const [scrolled, setScrolled] = useState(false);
  const [open, setOpen] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 24);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  useEffect(() => { setOpen(false); }, [route]);
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const isActive = (p) => (p === "/" ? route === "/" : route === p || route.indexOf(p + "/") === 0);

  return (
    <header className={"site-header" + (scrolled || open ? " scrolled" : "")}>

        <Link to="/" className="brand" aria-label={site.name + " — home"}>
          <Logo />

        {/* nav labels + header icon tooltips stay English in both languages */}
        <nav id="main-nav" className={"main-nav" + (open ? " open" : "")} aria-label="Primary navigation">
          {NAV_ITEMS.map((item) => (
            <Link key={item.path} to={item.path}
              className={"nav-link" + (isActive(item.path) ? " active" : "")}
              aria-current={isActive(item.path) ? "page" : undefined}>
              {item.label}
            </Link>
          ))}
        </nav>

        <div className="header-actions">
          <button className="lang-btn" onClick={toggleLang}
            aria-label={lang === "hi" ? "Read in English" : "Read in Hindi"}
            title={lang === "hi" ? "Read in English" : "Read in Hindi"}>
            {lang === "hi" ? "EN" : "हिं"}
          </button>
          <button className="icon-btn" onClick={onSearch} aria-label="Search the archive" title="Search (Esc to close)">
            <Icon name="search" size={19} />
          </button>
          <button className="icon-btn" onClick={toggleTheme}

  );

/* ============================================================
   6. DETAIL MODAL (reusable: timeline, rulers, fighters,
      granths, acharyas) — dialog semantics, ESC/overlay close,
      scroll lock, focus return, optional prev/next.
   ============================================================ */
function DetailModal({ open, onClose, title, subtitle, imageTitle, imageSrc, imageAlt, body, facts = [], refs = [], prevLabel, nextLabel, onPrev, onNext, footerNote }) {
  const panelRef = useRef(null);
  const returnRef = useRef(null);

  useEffect(() => {
    if (!open) return undefined;
    returnRef.current = document.activeElement;
    lockPageScroll();
    const t = setTimeout(() => { if (panelRef.current) panelRef.current.focus({ preventScroll: true }); }, 40);
    const onKey = (e) => {
      if (e.key === "Escape") { e.stopPropagation(); onClose(); }
      if (e.key === "Tab" && panelRef.current) {
        const f = panelRef.current.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])');
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener("keydown", onKey, true);
    return () => {
      clearTimeout(t);
      unlockPageScroll();
      document.removeEventListener("keydown", onKey, true);
      if (returnRef.current && returnRef.current.focus) returnRef.current.focus();
    };
  }, [open, onClose]);

  if (!open) return null;
  const stop = (e) => e.stopPropagation();
  return (
    <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>

          {refs && refs.length ? (

          {footerNote ? <p style={{ fontSize: ".84rem", color: "var(--text-faint)", marginTop: 14 }}>{t(footerNote)}</p> : null}

function openDetail(type, id) {

     even when the target page is already the current route */
