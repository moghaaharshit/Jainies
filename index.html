const TITLES = {
  "/": "Timeline of Jainism — Tirthankars, Agamas, Rulers & Jinlayas",
  "/tirthankars": "The 24 Tirthankaras · Timeline of Jainism",
  "/agamas": "The Jain Agamas · Timeline of Jainism",
  "/acharyas": "The Acharya Parampara · Timeline of Jainism",
  "/jain-rulers": "Jain Rulers, Patrons & Kingdoms · Timeline of Jainism",
  "/freedom-fighters": "Jain Freedom Fighters · Timeline of Jainism",
  "/jinlayas": "Jinlayas — Jain Temples Map of India · Timeline of Jainism",
  "/blog": "Stories, Wisdom & Heritage · Timeline of Jainism",
  "/reach-us": "Reach Us · Timeline of Jainism"
};

function App() {
  const rawRoute = useRoute();
  const route = ROUTE_REDIRECTS[rawRoute] || rawRoute;
  const [searchOpen, setSearchOpen] = useState(false);
  const [theme, setTheme] = useState(() => {
    try {
      const saved = window.localStorage.getItem("jh-theme");
      if (saved) return saved;
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    } catch (e) { return "light"; }
  });

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { window.localStorage.setItem("jh-theme", theme); } catch (e) { /* storage unavailable */ }
  }, [theme]);

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: "auto" });
    if (TITLES[route]) document.title = TITLES[route];
    else if (route.indexOf("/blog/") === 0) {
      const a = blogArticles.find((x) => x.slug === route.slice("/blog/".length));
      document.title = (a ? a.title : "Article") + " · Jain Heritage";
    } else document.title = "Jain Heritage";
  }, [route]);

  /* keyboard: ⌘K / Ctrl+K / "/" opens search */
  useEffect(() => {
    const onKey = (e) => {
      const tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      if ((e.key === "k" && (e.metaKey || e.ctrlKey)) || e.key === "/") {
        e.preventDefault();
        setSearchOpen(true);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  let page;
  if (route === "/") page = <HomePage />;
  else if (route === "/tirthankars") page = <TirthankarsPage />;
  else if (route === "/agamas") page = <AgamasPage />;
  else if (route === "/acharyas") page = <AcharyaPage />;
  else if (route === "/jain-rulers") page = <RulersPage />;
  else if (route === "/freedom-fighters") page = <FreedomFightersPage />;
  else if (route === "/jinlayas") page = <JinlayasPage />;
  else if (route === "/blog") page = <BlogPage />;
  else if (route.indexOf("/blog/") === 0) page = <ArticlePage slug={route.slice("/blog/".length)} />;
  else if (route === "/reach-us") page = <ReachUsPage />;
  else page = <NotFound route={rawRoute} />;

  return (
    <>
      <Header route={route} theme={theme}
        toggleTheme={() => setTheme(theme === "dark" ? "light" : "dark")}
        onSearch={() => setSearchOpen(true)} />
      <main id="main">{page}</main>
      <Footer />
      <SearchModal open={searchOpen} onClose={() => setSearchOpen(false)} />
    </>
  );
}

function adminEntryLabel(entry) {
  if (!entry || typeof entry !== "object") return "(empty)";
  const keys = ["title", "name", "book", "label", "slug", "id"];
  for (let i = 0; i < keys.length; i++) {
    if (typeof entry[keys[i]] === "string" && entry[keys[i]]) return String(entry[keys[i]]).slice(0, 72);
  }
  return "(untitled)";
}
function AdminJsonField({ label, value, onChange }) {
  const [text, setText] = useState(function () { return JSON.stringify(value, null, 1); });
  const [err, setErr] = useState("");
  const rows = Math.min(12, text.split("\n").length + 1);
  return (
    <label className="adm-field">
      <span>{label} — JSON</span>
      <textarea className="adm-json" rows={rows} value={text}
        onChange={(e) => {
          const t = e.target.value;
          setText(t);
          try { onChange(JSON.parse(t)); setErr(""); }
          catch (e2) { setErr("Invalid JSON: " + e2.message); }
        }} />
      {err ? <em className="adm-err">{err}</em> : null}
    </label>
  );
}
function AdminField({ name, value, onChange }) {
  const isImg = name === "img" || name === "image";
  const isWiki = name === "wiki" || name === "imageWiki";
  const label = isImg ? name + " — image link (https://…)"
    : (isWiki ? name + " — Wikipedia title OR image link" : name);
  if (value === null) {
    return (
      <label className="adm-field"><span>{label}</span>
        <input type="text" value="" placeholder="(empty)" onChange={(e) => onChange(e.target.value)} />
      </label>
    );
  }
  if (Array.isArray(value)) {
    if (value.length && typeof value[0] === "object") return <AdminJsonField label={label} value={value} onChange={onChange} />;
    return (
      <label className="adm-field"><span>{label} — one per line</span>
        <textarea rows={Math.min(9, value.length + 1)} value={value.join("\n")}
          onChange={(e) => onChange(e.target.value.split("\n"))} />
      </label>
    );
  }
  if (typeof value === "object") return <AdminJsonField label={label} value={value} onChange={onChange} />;
  if (typeof value === "number") {
    return (
      <label className="adm-field"><span>{label}</span>
        <input type="number" value={value} onChange={(e) => onChange(e.target.value === "" ? 0 : Number(e.target.value))} />
      </label>
    );
  }
  const long = typeof value === "string" && (value.length > 95 ||
    ["bio", "body", "summary", "excerpt", "description", "lead"].indexOf(name) !== -1);
  return (
    <label className="adm-field"><span>{label}</span>
      {long
        ? <textarea rows={4} value={String(value)} onChange={(e) => onChange(e.target.value)} />
        : <input type="text" value={String(value)} onChange={(e) => onChange(e.target.value)} />}
      {isImg && value ? <img className="adm-imgprev" src={String(value)} alt="" onError={(e) => { e.target.style.display = "none"; }} /> : null}
      {isWiki && typeof value === "string" && value && !/^https?:\/\//i.test(value)
        ? <small style={{ color: "var(--text-faint)", fontSize: ".7rem" }}>Wikipedia title (auto image). Paste an https link to use your own image.</small>
        : null}
    </label>
  );
}
function AdminEntryCard({ index, entry, onChange, onRemove, onDuplicate, onMove }) {
  const [open, setOpen] = useState(false);
  const keys = entry && typeof entry === "object" ? Object.keys(entry) : [];
  return (
    <div className="adm-entry">
      <div className="adm-entry-head">
        <span className="adm-idx">#{index + 1}</span>
        <strong title={adminEntryLabel(entry)}>{adminEntryLabel(entry)}</strong>
        <button className="adm-mini" title="Move up" onClick={() => onMove(-1)}>↑</button>
        <button className="adm-mini" title="Move down" onClick={() => onMove(1)}>↓</button>
        <button className="adm-mini" title="Duplicate" onClick={onDuplicate}>⧉</button>
        <button className="adm-mini" title="Delete" onClick={onRemove}>✕</button>
        <button className="adm-mini" title={open ? "Collapse" : "Edit"} onClick={() => setOpen(!open)}>{open ? "−" : "✎"}</button>
      </div>
      {open ? (
        <div className="adm-entry-body">
          {keys.map((k) => (
            <AdminField key={k} name={k} value={entry[k]}
              onChange={(v) => { const next = Object.assign({}, entry); next[k] = v; onChange(next); }} />
          ))}
          {keys.length === 0 ? <div className="adm-empty">Empty object — add fields via JSON after saving a template entry.</div> : null}
        </div>
      ) : null}
    </div>
  );
}
function AdminPanel({ onClose }) {
  const [snap, setSnap] = useState(function () { return contentSnapshot(); });
  const [sectionKey, setSectionKey] = useState("site");
  const [q, setQ] = useState("");
  const [limit, setLimit] = useState(40);
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const [dirty, setDirty] = useState(false);
  const section = CONTENT_SECTIONS.find((s) => s.key === sectionKey) || CONTENT_SECTIONS[0];
  const data = snap[section.key];

  const update = (next) => { setSnap(next); setDirty(true); setStatus(""); };
  const setData = (value) => update(Object.assign({}, snap, { [section.key]: value }));
  const setEntry = (i, entry) => { const arr = data.slice(); arr[i] = entry; setData(arr); };
  const removeEntry = (i) => { if (!window.confirm("Delete entry #" + (i + 1) + " (" + adminEntryLabel(data[i]) + ")?")) return; const arr = data.slice(); arr.splice(i, 1); setData(arr); };
  const dupEntry = (i) => { const arr = data.slice(); arr.splice(i + 1, 0, JSON.parse(JSON.stringify(arr[i]))); setData(arr); };
  const moveEntry = (i, dir) => { const arr = data.slice(); const j = i + dir; if (j < 0 || j >= arr.length) return; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; setData(arr); };
  const addEntry = () => {
    const arr = data.slice();
    const base = arr.length ? JSON.parse(JSON.stringify(arr[0])) : {};
    Object.keys(base).forEach((k) => {
      const v = base[k];
      if (typeof v === "string") base[k] = "";
      else if (typeof v === "number") base[k] = 0;
      else if (Array.isArray(v)) base[k] = [];
      else if (v && typeof v === "object") base[k] = {};
    });
    if ("id" in base) base.id = "new-" + Date.now();
    arr.push(base);
    setData(arr);
  };

  const saveLocal = () => {
    setBusy(true);
    setStatus("Saving locally…");
    try {
      window.localStorage.setItem(CONTENT_LOCAL_KEY, JSON.stringify(snap));
      setStatus("Saved locally — reloading…");
      setTimeout(function () { window.location.reload(); }, 400);
    } catch (e) {
      setBusy(false);
      setStatus("Local save failed: " + e.message);
    }
  };
  const publish = () => {
    setBusy(true);
    setStatus("Publishing to Firebase…");
    try { window.localStorage.setItem(CONTENT_LOCAL_KEY, JSON.stringify(snap)); } catch (e) {}
    publishContentToCloud(snap).then(function () {
      setStatus("Published to Firebase — reloading…");
      setTimeout(function () { window.location.reload(); }, 500);
    }).catch(function (e) {
      setBusy(false);
      setStatus("Saved locally, but Firebase publish failed: " + (e && e.message ? e.message : e) +
        " — check Firestore rules (collection ‘" + CONTENT_COLLECTION + "’) and your network.");
    });
  };
  const resetAll = () => {
    if (!window.confirm("Reset ALL sections to the built-in defaults? (Cloud copy stays unless you publish again.)")) return;
    try { window.localStorage.removeItem(CONTENT_LOCAL_KEY); } catch (e) {}
    setStatus("Local overrides cleared — reloading…");
    setTimeout(function () { window.location.reload(); }, 400);
  };
  const close = () => { if (dirty && !window.confirm("You have unsaved edits. Close anyway?")) return; onClose(); };
  useEffect(() => {
    const h = (e) => { if (e.key === "Escape") close(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  });

  const isArr = section.kind === "array" && Array.isArray(data);
  const idxs = isArr ? data.map((e, i) => i).filter((i) => {
    if (!q) return true;
    try { return JSON.stringify(data[i]).toLowerCase().indexOf(q.toLowerCase()) !== -1; } catch (e) { return false; }
  }) : [];
  const shown = q ? idxs : idxs.slice(0, limit);

  return (
    <div className="admin-mount">
      <div className="admin-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) close(); }}>
        <div className="admin-panel" role="dialog" aria-label="Admin panel">
          <div className="adm-head">
            <h2>Admin Panel<span className="adm-sub">12 logo clicks · edits save to this browser + Firebase “{CONTENT_COLLECTION}”</span></h2>
            <button className="btn ghost small" onClick={close}>Close (Esc)</button>
          </div>
          <div className="adm-body">
            <nav className="adm-side" aria-label="Sections">
              {CONTENT_SECTIONS.map((s) => (
                <button key={s.key} className={s.key === section.key ? "on" : ""}
                  onClick={() => { setSectionKey(s.key); setQ(""); setLimit(40); }}>
                  {s.label}
                  <span className="adm-count">{s.kind === "array" && Array.isArray(snap[s.key]) ? snap[s.key].length : "⚙"}</span>
                </button>
              ))}
            </nav>
            <main className="adm-main">
              <div className="adm-toolbar">
                {isArr ? (
                  <>
                    <input type="search" placeholder={"Search " + section.label + "…"} value={q}
                      onChange={(e) => setQ(e.target.value)} aria-label="Search entries" />
                    <button className="btn secondary small" onClick={addEntry}>+ Add entry</button>
                    <span className="count-note">{isArr ? data.length : 0} entries</span>
                  </>
                ) : (
                  <span className="count-note">Site-wide strings — name, tagline, contact, social links.</span>
                )}
              </div>
              {isArr ? (
                shown.length === 0 ? (
                  <div className="adm-empty">No entries match “{q}”.</div>
                ) : (
                  <>
                    {shown.map((i) => (
                      <AdminEntryCard key={i} index={i} entry={data[i]}
                        onChange={(e2) => setEntry(i, e2)}
                        onRemove={() => removeEntry(i)}
                        onDuplicate={() => dupEntry(i)}
                        onMove={(d) => moveEntry(i, d)} />
                    ))}
                    {!q && idxs.length > shown.length ? (
                      <div style={{ textAlign: "center", marginTop: 14 }}>
                        <button className="btn secondary small" onClick={() => setLimit((l) => l + 60)}>
                          Show more ({shown.length} of {idxs.length})
                        </button>
                      </div>
                    ) : null}
                  </>
                )
              ) : (
                <div className="adm-entry">
                  <div className="adm-entry-body">
                    {data && typeof data === "object" ? Object.keys(data).map((k) => (
                      <AdminField key={k} name={k} value={data[k]}
                        onChange={(v) => setData(Object.assign({}, data, { [k]: v }))} />
                    )) : <div className="adm-empty">No data.</div>}
                  </div>
                </div>
              )}
            </main>
          </div>
          <div className="adm-foot">
            <button className="btn small" onClick={saveLocal} disabled={busy}>Save (this browser)</button>
            <button className="btn secondary small" onClick={publish} disabled={busy}>Publish to Firebase</button>
            <button className="btn ghost small" onClick={resetAll} disabled={busy}>Reset to defaults</button>
            <span className="adm-status" aria-live="polite">{status}</span>
          </div>
        </div>
      </div>
    </div>
  );
}
const ADMIN_PASSWORD = "jainism@123";
function AdminGate({ onClose }) {

  const [ok, setOk] = useState(false);

            onChange={(e) => { setPw(e.target.value); setErr(""); }} />
          <div className="adm-gate-actions">
            <button type="submit" className="btn small">Unlock</button>
            <button type="button" className="btn ghost small" onClick={onClose}>Cancel</button>
          </div>

        {err ? <em className="adm-err">{err}</em> : null}
      </div>
    </div>

}
let __adminMountEl = null;
let __adminReactRoot = null;
function openAdminPanel() {
  if (__adminReactRoot) return;
  __adminMountEl = document.createElement("div");
  __adminMountEl.className = "admin-mount";
  document.body.appendChild(__adminMountEl);
  __adminReactRoot = ReactDOM.createRoot(__adminMountEl);
  const close = () => {
    try { __adminReactRoot.render(null); } catch (e) {}
    if (__adminMountEl && __adminMountEl.parentNode) __adminMountEl.parentNode.removeChild(__adminMountEl);
    __adminReactRoot = null;
    __adminMountEl = null;
  };
  __adminReactRoot.render(<AdminGate onClose={close} />);
}
/* the gate: 12 clicks on any .brand logo (header or footer) */
(function adminGate() {
  let clicks = 0;
  let timer = 0;
  document.addEventListener("click", function (e) {
    const brand = e.target && e.target.closest ? e.target.closest(".brand") : null;
    if (!brand) return;
    clicks += 1;
    window.clearTimeout(timer);
    timer = window.setTimeout(function () { clicks = 0; }, 1500);
    if (clicks >= 12) {
      clicks = 0;
      window.clearTimeout(timer);
      openAdminPanel();
    }
  });
})();
/* test/backup entry point: ?admin=1 or #admin */
if (/[?&]admin=1/.test(window.location.search) || window.location.hash === "#admin") {
  setTimeout(openAdminPanel, 600);
}
